<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DnD Adventure</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--tg-theme-bg-color, #17181c);
    --text: var(--tg-theme-text-color, #f2f2f2);
    --hint: var(--tg-theme-hint-color, #8b8b8f);
    --btn: var(--tg-theme-button-color, #2ea6ff);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: rgba(255, 255, 255, 0.06);
    --hp: #e5484d;
    --attr: #2ea6ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  }

  /* --- Tabs (fixed bottom bar) --- */
  #tabs {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    gap: 8px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    background: var(--bg);
    border-top: 1px solid var(--card);
    z-index: 10;
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: var(--card);
    color: var(--hint);
    font-size: 14px;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--btn);
    color: var(--btn-text);
  }
  .view { display: none; }
  .view.active { display: block; }

  /* --- Story view --- */
  #status {
    font-size: 14px;
    color: var(--hint);
    margin-bottom: 14px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  #rollResult { margin-bottom: 12px; }
  .roll-card {
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--card);
    font-size: 15px;
  }
  .dice-anim {
    display: none;
    flex-direction: column;
    align-items: center;
    margin-bottom: 16px;
    perspective: 600px;
  }
  .die-face {
    width: 110px;
    height: 110px;
    position: relative;
  }
  .die-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .die-number {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    pointer-events: none;
  }
  .die-face.settled {
    animation: dice-pop 0.35s ease;
  }
  @keyframes dice-pop {
    0%   { transform: scale(1.3); }
    60%  { transform: scale(0.92); }
    100% { transform: scale(1); }
  }
  .die-shadow {
    width: 52px;
    height: 11px;
    margin-top: 12px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.4);
    filter: blur(2px);
  }
  .die-shadow.spinning {
    animation: shadow-pulse 0.5s linear infinite;
  }
  .die-shadow.settled {
    animation: shadow-land 0.4s ease;
  }
  @keyframes shadow-pulse {
    0%, 100% { transform: scale(1);   opacity: 0.4; }
    50%      { transform: scale(0.65); opacity: 0.22; }
  }
  @keyframes shadow-land {
    0%   { transform: scale(0.55); opacity: 0.15; }
    50%  { transform: scale(1.2);  opacity: 0.45; }
    100% { transform: scale(1);    opacity: 0.4; }
  }
  #story {
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 16px;
    margin-bottom: 18px;
    min-height: 40px;
  }
  .btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    margin: 6px 0;
    border: none;
    border-radius: 12px;
    background: var(--btn);
    color: var(--btn-text);
    font-size: 15px;
    cursor: pointer;
  }
  .btn:active { opacity: 0.8; }
  #textRow { display: flex; gap: 8px; margin-top: 14px; }
  #freeText {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--hint);
    background: transparent;
    color: var(--text);
    font-size: 15px;
  }
  #sendBtn {
    padding: 0 16px;
    border: none;
    border-radius: 10px;
    background: var(--btn);
    color: var(--btn-text);
    font-size: 18px;
  }
  #diceBtn {
    background: transparent;
    border: 1px solid var(--hint);
    color: var(--text);
  }

  /* --- Character view --- */
  .section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--hint);
    margin: 18px 0 8px;
  }
  .section-title:first-child { margin-top: 0; }
  .hp-bar-track {
    height: 14px;
    border-radius: 8px;
    background: var(--card);
    overflow: hidden;
  }
  .hp-bar-fill {
    height: 100%;
    background: var(--hp);
    transition: width 0.3s ease;
  }
  .hp-label {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .money-line {
    font-size: 15px;
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--card);
  }
  .attr-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .attr-name { width: 40%; color: var(--hint); }
  .attr-bar-track {
    flex: 1;
    height: 10px;
    border-radius: 6px;
    background: var(--card);
    overflow: hidden;
  }
  .attr-bar-fill {
    height: 100%;
    background: var(--attr);
  }
  .attr-value { width: 24px; text-align: right; }
  .inv-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .inv-item {
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--card);
    font-size: 13px;
    line-height: 1.35;
  }
  .empty-note {
    color: var(--hint);
    font-size: 14px;
  }
</style>
</head>
<body>

  <div id="tabs">
    <button class="tab-btn active" id="tabStoryBtn" onclick="switchTab('story')">🗺️ Історія</button>
    <button class="tab-btn" id="tabCharBtn" onclick="switchTab('character')">🧙 Персонаж</button>
  </div>

  <div id="storyView" class="view active">
    <div id="status"></div>
    <div class="dice-anim" id="diceAnim">
      <div class="die-face" id="dieFace">
        <canvas id="diceCanvas" class="die-canvas"></canvas>
        <span class="die-number" id="dieNumber">?</span>
      </div>
      <div class="die-shadow" id="dieShadow"></div>
    </div>
    <div id="rollResult"></div>
    <div id="story">Завантаження...</div>
    <div id="options"></div>
    <button class="btn" id="diceBtn" onclick="sendManualRoll()">🎲 Кинути d20</button>
    <div id="textRow">
      <input id="freeText" placeholder="Опиши свою дію..." onkeydown="if(event.key==='Enter') sendFreeText()">
      <button id="sendBtn" onclick="sendFreeText()">➤</button>
    </div>
  </div>

  <div id="characterView" class="view">
    <div class="section-title">Здоров'я</div>
    <div id="charHp"></div>

    <div class="section-title">Гроші</div>
    <div id="charMoney"></div>

    <div class="section-title">Характеристики</div>
    <div id="charAttrs"></div>

    <div class="section-title">Інвентар</div>
    <div id="charInventory"></div>
  </div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
const initData = tg.initData;

let lastCharacter = null;
let diceInterval = null;

// --- Real 3D d20 (icosahedron) via three.js ---
let scene, camera, renderer, dieMesh;
let rotSpeed = { x: 0.002, y: 0.004, z: 0.001 };
let decelInterval = null;

function initDiceScene() {
  const canvas = document.getElementById("diceCanvas");
  const size = 110;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(35, 1, 0.1, 10);
  camera.position.set(0, 0, 4.2);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(size, size, false);

  const geometry = new THREE.IcosahedronGeometry(1.15, 0); // radius, detail=0 -> exactly 20 faces
  const material = new THREE.MeshPhongMaterial({
    color: 0x5b6373,
    flatShading: true,
    shininess: 30,
    specular: 0x333333,
  });
  dieMesh = new THREE.Mesh(geometry, material);
  scene.add(dieMesh);

  const edges = new THREE.EdgesGeometry(geometry);
  const edgeLines = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x14151a }));
  dieMesh.add(edgeLines);

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 0.9);
  key.position.set(2, 3, 4);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0x88aaff, 0.35);
  fill.position.set(-3, -1, -2);
  scene.add(fill);

  renderDiceLoop();
}

function renderDiceLoop() {
  requestAnimationFrame(renderDiceLoop);
  if (!dieMesh) return;
  dieMesh.rotation.x += rotSpeed.x;
  dieMesh.rotation.y += rotSpeed.y;
  dieMesh.rotation.z += rotSpeed.z;
  renderer.render(scene, camera);
}

function startDiceAnimation(sides) {
  const wrap = document.getElementById("diceAnim");
  const face = document.getElementById("dieFace");
  const shadow = document.getElementById("dieShadow");
  const number = document.getElementById("dieNumber");
  clearInterval(decelInterval);
  wrap.style.display = "flex";
  face.classList.remove("settled");
  shadow.classList.remove("settled");
  shadow.classList.add("spinning");
  rotSpeed = { x: 0.18, y: 0.24, z: 0.1 };
  number.textContent = "?";
  diceInterval = setInterval(() => {
    number.textContent = String(1 + Math.floor(Math.random() * sides));
  }, 70);
}

function stopDiceAnimation(finalValue) {
  return new Promise(resolve => {
    clearInterval(diceInterval);
    const wrap = document.getElementById("diceAnim");
    const face = document.getElementById("dieFace");
    const shadow = document.getElementById("dieShadow");
    const number = document.getElementById("dieNumber");

    number.textContent = String(finalValue ?? "?");
    shadow.classList.remove("spinning");
    shadow.classList.add("settled");
    face.classList.add("settled");

    // Ease the spin down to a slow idle instead of stopping abruptly.
    decelInterval = setInterval(() => {
      rotSpeed.x *= 0.85;
      rotSpeed.y *= 0.85;
      rotSpeed.z *= 0.85;
      if (Math.abs(rotSpeed.y) < 0.004) {
        clearInterval(decelInterval);
        rotSpeed = { x: 0.002, y: 0.004, z: 0.001 };
      }
    }, 40);

    setTimeout(() => {
      wrap.style.display = "none";
      face.classList.remove("settled");
      shadow.classList.remove("settled");
      resolve();
    }, 650);
  });
}

function switchTab(name) {
  document.getElementById("storyView").classList.toggle("active", name === "story");
  document.getElementById("characterView").classList.toggle("active", name === "character");
  document.getElementById("tabStoryBtn").classList.toggle("active", name === "story");
  document.getElementById("tabCharBtn").classList.toggle("active", name === "character");
  if (name === "character") renderCharacterView();
}

async function api(path, body) {
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ initData, ...body }),
  });
  return res.json();
}

function renderStatus(character) {
  const el = document.getElementById("status");
  if (!character) { el.textContent = ""; return; }
  let parts = [`❤️ ${character.hp ?? "?"}/${character.max_hp ?? "?"}`];
  if (character.money) parts.push(`💰 ${character.money}`);
  el.textContent = parts.join("   ");
}

function renderStory(text) {
  document.getElementById("story").textContent = text || "";
}

function renderOptions(options) {
  const el = document.getElementById("options");
  el.innerHTML = "";
  (options || []).forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "btn";
    btn.textContent = (i + 1) + ") " + opt.text + (opt.requires_roll ? " 🎲" : "");
    btn.onclick = () => sendChoice(i + 1, opt.requires_roll);
    el.appendChild(btn);
  });
}

const TIER_LABEL = {
  critical_failure: "💥 Фатальна невдача",
  failure: "❌ Невдача",
  partial_success: "➖ Частковий успіх",
  success: "✅ Успіх",
  critical_success: "🌟 Критичний успіх",
};

function renderRoll(roll) {
  const el = document.getElementById("rollResult");
  if (!roll) { el.innerHTML = ""; return; }
  const penaltyText = roll.penalty ? ` (штраф ${roll.penalty})` : "";
  el.innerHTML = `<div class="roll-card">🎲 d${roll.sides}: ${roll.value}${penaltyText} → підсумок ${roll.total}<br>${TIER_LABEL[roll.tier] || roll.tier}</div>`;
}

function renderCharacterView() {
  const c = lastCharacter || {};

  // HP bar
  const hp = c.hp ?? 0;
  const maxHp = c.max_hp ?? 0;
  const pct = maxHp > 0 ? Math.max(0, Math.min(100, (hp / maxHp) * 100)) : 0;
  document.getElementById("charHp").innerHTML = `
    <div class="hp-label"><span>${hp} / ${maxHp}</span></div>
    <div class="hp-bar-track"><div class="hp-bar-fill" style="width:${pct}%"></div></div>
  `;

  // Money
  document.getElementById("charMoney").innerHTML = c.money
    ? `<div class="money-line">💰 ${c.money}</div>`
    : `<div class="empty-note">Невідомо</div>`;

  // Attributes
  const attrs = c.attributes || {};
  const attrKeys = Object.keys(attrs);
  const attrsEl = document.getElementById("charAttrs");
  if (!attrKeys.length) {
    attrsEl.innerHTML = `<div class="empty-note">Немає даних</div>`;
  } else {
    attrsEl.innerHTML = attrKeys.map(key => {
      const raw = attrs[key];
      const value = typeof raw === "number" ? raw : parseFloat(raw) || 0;
      const barPct = Math.max(0, Math.min(100, (value / 10) * 100));
      return `
        <div class="attr-row">
          <div class="attr-name">${key}</div>
          <div class="attr-bar-track"><div class="attr-bar-fill" style="width:${barPct}%"></div></div>
          <div class="attr-value">${raw}</div>
        </div>
      `;
    }).join("");
  }

  // Inventory
  const items = c.inventory || [];
  const invEl = document.getElementById("charInventory");
  if (!items.length) {
    invEl.innerHTML = `<div class="empty-note">Порожньо</div>`;
  } else {
    invEl.innerHTML = `<div class="inv-grid">` +
      items.map(item => `<div class="inv-item">🎒 ${item}</div>`).join("") +
      `</div>`;
  }
}

function applyState(data) {
  lastCharacter = data.character || null;
  renderStatus(data.character);
  renderStory(data.text);
  renderOptions(data.options);
  if (document.getElementById("characterView").classList.contains("active")) {
    renderCharacterView();
  }
}

function setLoading() {
  renderRoll(null);
  document.getElementById("options").innerHTML = "";
  renderStory("...");
}

async function loadState() {
  const data = await api("/api/state", {});
  if (data.error) {
    renderStory(
      data.error === "no_active_game"
        ? "Немає активної пригоди. Почни /new в чаті з ботом."
        : "Не вдалося авторизуватись. Відкрий цю сторінку через кнопку в боті."
    );
    return;
  }
  applyState(data);
}

function handleActionResult(data) {
  if (data.error) {
    renderStory("Помилка: " + (data.detail || data.error));
    return;
  }
  renderRoll(data.roll);
  applyState(data);
  if (data.defeated) {
    document.getElementById("story").textContent += "\n\n💀 Персонаж втратив свідомість.";
  }
}

async function sendChoice(index, requiresRoll) {
  if (requiresRoll) startDiceAnimation(20);
  setLoading();
  const data = await api("/api/action", { type: "choice", index });
  if (requiresRoll) await stopDiceAnimation(data.roll ? data.roll.value : null);
  handleActionResult(data);
}

async function sendManualRoll() {
  startDiceAnimation(20);
  setLoading();
  const data = await api("/api/action", { type: "roll", sides: 20 });
  await stopDiceAnimation(data.roll ? data.roll.value : null);
  handleActionResult(data);
}

async function sendFreeText() {
  const input = document.getElementById("freeText");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  setLoading();
  const data = await api("/api/action", { type: "text", text });
  handleActionResult(data);
}

initDiceScene();
loadState();
</script>
</body>
</html>
