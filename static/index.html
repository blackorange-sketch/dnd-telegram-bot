<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DnD Adventure</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Orbitron:wght@600;800&family=Creepster&family=Audiowide&family=Special+Elite&family=Metal+Mania&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--tg-theme-bg-color, #17181c);
    --text: var(--tg-theme-text-color, #f2f2f2);
    --hint: var(--tg-theme-hint-color, #8b8b8f);
    --btn: #1a56c7;
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: rgba(255, 255, 255, 0.06);
    --hp: #e5484d;
    --attr: #2ea6ff;
    --font-heading: inherit;
    --bg-image: none;
    --tg-extra-top: 0px;
    --tg-extra-bottom: 0px;
    /* Reserve room for Telegram's native "close" button, which floats over
       the page when true fullscreen isn't active (older clients, or before
       requestFullscreen() resolves). Zeroed out once fullscreen is confirmed
       — see applyHeaderSafeTop() in the script below. */
    --header-safe-top: 54px;
  }

  /* --- Per-category themes, applied via html[data-theme="..."] --- */
  html[data-theme="fantasy"] {
    --bg: #1c140c; --card: rgba(196, 154, 84, 0.14); --btn: #6b3f1d;
    --btn-text: #f4e4c1; --hint: #b89968; --hp: #c0392b; --attr: #d4af5a;
    --text: #f0e6d2; --font-heading: 'Cinzel', serif;
    --btn-glow: inset 0 0 0 1px rgba(212,175,90,0.4);
    --bg-image: radial-gradient(circle at 15% 10%, rgba(212,175,90,0.10), transparent 42%),
                radial-gradient(circle at 85% 90%, rgba(107,63,29,0.16), transparent 48%);
  }
  html[data-theme="scifi"] {
    --bg: #060f18; --card: rgba(46, 166, 255, 0.10); --btn: #0e5a78;
    --btn-text: #d9faff; --hint: #6fa8c9; --hp: #ff5470; --attr: #2ea6ff;
    --text: #dff6ff; --font-heading: 'Orbitron', sans-serif;
    --btn-glow: 0 0 10px rgba(46,166,255,0.45), inset 0 0 0 1px rgba(46,166,255,0.5);
    --bg-image: repeating-linear-gradient(90deg, rgba(46,166,255,0.05) 0 1px, transparent 1px 48px),
                repeating-linear-gradient(0deg, rgba(46,166,255,0.05) 0 1px, transparent 1px 48px);
  }
  html[data-theme="postapo"] {
    --bg: #161512; --card: rgba(214, 158, 46, 0.10); --btn: #7a4a12;
    --btn-text: #fff3d6; --hint: #a08c6e; --hp: #d94f2b; --attr: #d9a02b;
    --text: #ece3d2; --font-heading: 'Metal Mania', cursive;
    --btn-glow: inset 0 0 0 1px rgba(217,160,43,0.35);
    --bg-image: radial-gradient(circle at 25% 20%, rgba(217,79,43,0.10), transparent 40%),
                radial-gradient(circle at 75% 75%, rgba(217,160,43,0.08), transparent 45%);
  }
  html[data-theme="horror"] {
    --bg: #0d0505; --card: rgba(139, 0, 0, 0.16); --btn: #4a0e0e;
    --btn-text: #e8d9c8; --hint: #8a6a6a; --hp: #d94f4f; --attr: #b23a3a;
    --text: #e8d9c8; --font-heading: 'Creepster', cursive;
    --btn-glow: inset 0 0 0 1px rgba(178,58,58,0.4);
    --bg-image: radial-gradient(circle at 50% 0%, rgba(139,0,0,0.18), transparent 55%);
  }
  html[data-theme="cyberpunk"] {
    --bg: #08040f; --card: rgba(217, 70, 239, 0.10); --btn: #7a1fa2;
    --btn-text: #fdeeff; --hint: #a875c9; --hp: #ff2f92; --attr: #38e8ff;
    --text: #f2e8ff; --font-heading: 'Audiowide', sans-serif;
    --btn-glow: 0 0 14px rgba(255,47,224,0.5), inset 0 0 0 1px rgba(56,232,255,0.6);
    --bg-image: linear-gradient(180deg, rgba(217,70,239,0.08), transparent 30%),
                repeating-linear-gradient(90deg, rgba(56,232,255,0.04) 0 2px, transparent 2px 40px);
  }
  html[data-theme="steampunk"] {
    --bg: #17110a; --card: rgba(184, 134, 66, 0.14); --btn: #6e4a1f;
    --btn-text: #f5e8cf; --hint: #b08a55; --hp: #c0392b; --attr: #c9973e;
    --text: #f0e2c8; --font-heading: 'Special Elite', cursive;
    --btn-glow: inset 0 0 0 1px rgba(201,151,62,0.45);
    --bg-image: radial-gradient(circle at 20% 85%, rgba(201,151,62,0.10), transparent 42%),
                radial-gradient(circle at 80% 15%, rgba(110,74,31,0.14), transparent 46%);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background-color: var(--bg);
    background-image: var(--bg-image);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: background-color 0.4s ease, color 0.4s ease;
  }
  body {
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px) + var(--tg-extra-top, 0px) + var(--header-safe-top, 0px));
    padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px) + var(--tg-extra-bottom, 0px));
  }

  /* --- Tabs (fixed bottom bar) --- */
  #tabs {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    gap: 8px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px) + var(--tg-extra-bottom, 0px));
    background: var(--bg);
    border-top: 1px solid var(--card);
    z-index: 10;
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: var(--card);
    color: var(--hint);
    font-size: 14px;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--btn);
    color: var(--btn-text);
  }
  .view { display: none; }

  /* --- Side menu (settings drawer) --- */
  .menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 20;
  }
  .menu-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }
  .side-menu {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(300px, 82vw);
    background: var(--bg);
    border-left: 1px solid var(--card);
    transform: translateX(100%);
    transition: transform 0.28s ease;
    z-index: 21;
    padding: calc(16px + env(safe-area-inset-top, 0px) + var(--tg-extra-top, 0px) + var(--header-safe-top, 0px)) 16px 16px;
    overflow-y: auto;
  }
  .side-menu.open { transform: translateX(0); }
  .side-menu-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    font-size: 17px;
    font-weight: 700;
    font-family: var(--font-heading);
  }
  .menu-close {
    background: none;
    border: none;
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
  }
  .side-menu-section { margin-bottom: 22px; }
  .menu-toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--card);
    cursor: pointer;
  }
  .menu-toggle-row input { transform: scale(1.15); }
  .menu-log-details { margin: 0; }
  .side-menu-section .menu-log-summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--card);
    cursor: pointer;
    margin: 0;
    list-style: none;
  }
  .menu-log-summary::-webkit-details-marker { display: none; }
  .menu-log-summary::after {
    content: "▸";
    color: var(--hint);
    transition: transform 0.2s ease;
  }
  .menu-log-details[open] .menu-log-summary::after {
    transform: rotate(90deg);
  }
  .menu-log-list {
    max-height: 40vh;
    overflow-y: auto;
    margin-top: 8px;
  }
  .view.active { display: block; }

  /* --- Story view --- */
  #status {
    font-size: 14px;
    color: var(--hint);
    margin-bottom: 14px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  #rollResult { margin-bottom: 12px; }
  .roll-card {
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--card);
    font-size: 15px;
  }
  #changesResult { margin-bottom: 12px; }
  .changes-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .delta {
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    background: var(--card);
  }
  .delta.positive { color: #3ecf6e; }
  .delta.negative { color: #e5484d; }
  .dice-anim {
    display: none;
    flex-direction: column;
    align-items: center;
    margin-bottom: 16px;
    perspective: 600px;
  }
  .die-face {
    width: 110px;
    height: 110px;
    position: relative;
  }
  .die-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .die-number {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    pointer-events: none;
  }
  .die-face.settled {
    animation: dice-pop 0.35s ease;
  }
  @keyframes dice-pop {
    0%   { transform: scale(1.3); }
    60%  { transform: scale(0.92); }
    100% { transform: scale(1); }
  }
  .die-shadow {
    width: 52px;
    height: 11px;
    margin-top: 12px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.4);
    filter: blur(2px);
  }
  .die-shadow.spinning {
    animation: shadow-pulse 0.5s linear infinite;
  }
  .die-shadow.settled {
    animation: shadow-land 0.4s ease;
  }
  @keyframes shadow-pulse {
    0%, 100% { transform: scale(1);   opacity: 0.4; }
    50%      { transform: scale(0.65); opacity: 0.22; }
  }
  @keyframes shadow-land {
    0%   { transform: scale(0.55); opacity: 0.15; }
    50%  { transform: scale(1.2);  opacity: 0.45; }
    100% { transform: scale(1);    opacity: 0.4; }
  }
  #story {
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 16px;
    margin-bottom: 18px;
    min-height: 40px;
  }
  .btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    margin: 6px 0;
    border: 1px solid transparent;
    border-radius: 12px;
    background: var(--btn);
    color: var(--btn-text);
    font-size: 15px;
    cursor: pointer;
    box-shadow: var(--btn-glow, none);
    transition: background-color 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
  }
  .btn:active { opacity: 0.8; }
  .btn:disabled, #sendBtn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  #textRow { display: flex; gap: 8px; margin-top: 14px; }
  #freeText {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--hint);
    background: transparent;
    color: var(--text);
    font-size: 15px;
  }
  #sendBtn {
    padding: 0 16px;
    border: none;
    border-radius: 10px;
    background: var(--btn);
    color: var(--btn-text);
    font-size: 18px;
  }
  #diceBtn {
    background: transparent;
    border: 1px solid var(--hint);
    color: var(--text);
  }

  /* --- Character view --- */
  .section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--hint);
    margin: 18px 0 8px;
    font-family: var(--font-heading);
  }
  .section-title:first-child { margin-top: 0; }
  .hp-bar-track {
    height: 14px;
    border-radius: 8px;
    background: var(--card);
    overflow: hidden;
  }
  .hp-bar-fill {
    height: 100%;
    background: var(--hp);
    transition: width 0.3s ease;
  }
  .hp-label {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .money-line {
    font-size: 15px;
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--card);
  }
  .attr-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .attr-name { width: 40%; color: var(--hint); }
  .attr-bar-track {
    flex: 1;
    height: 10px;
    border-radius: 6px;
    background: var(--card);
    overflow: hidden;
  }
  .attr-bar-fill {
    height: 100%;
    background: var(--attr);
  }
  .attr-value { width: 24px; text-align: right; }
  .inv-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .inv-item {
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--card);
    font-size: 13px;
    line-height: 1.35;
  }
  .empty-note {
    color: var(--hint);
    font-size: 14px;
  }

  /* --- Onboarding wizard --- */
  #onboardingView { padding-bottom: 20px; }
  .wiz-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 14px;
    font-family: var(--font-heading);
  }
  .wiz-subtitle {
    font-size: 14px;
    color: var(--hint);
    margin-bottom: 12px;
  }
  .wiz-textarea {
    width: 100%;
    min-height: 90px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--hint);
    background: transparent;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
    margin-bottom: 10px;
  }
  .wiz-input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--hint);
    background: transparent;
    color: var(--text);
    font-size: 15px;
    margin-bottom: 10px;
  }
  .btn.secondary {
    background: transparent;
    border: 1px solid var(--hint);
    color: var(--text);
  }
  .preview-card {
    padding: 14px;
    border-radius: 12px;
    background: var(--card);
    font-size: 15px;
    line-height: 1.5;
    margin-bottom: 14px;
    white-space: pre-wrap;
  }
  .wiz-loading {
    color: var(--hint);
    font-size: 14px;
    padding: 20px 0;
    text-align: center;
  }

  /* --- Log (history) view --- */
  .log-entry {
    padding: 10px 14px;
    border-radius: 12px;
    margin-bottom: 8px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .log-entry.player {
    background: var(--btn);
    color: var(--btn-text);
    margin-left: 24px;
  }
  .log-entry.dm {
    background: var(--card);
    margin-right: 24px;
  }
</style>
</head>
<body>

  <div id="tabs" style="display:none;">
    <button class="tab-btn active" id="tabStoryBtn" onclick="switchTab('story')">🗺️ Історія</button>
    <button class="tab-btn" id="tabCharBtn" onclick="switchTab('character')">🧙 Персонаж</button>
    <button class="tab-btn" id="menuBtn" onclick="openMenu()">☰ Меню</button>
  </div>

  <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
  <div class="side-menu" id="sideMenu">
    <div class="side-menu-header">
      <span id="menuTitle">⚙️ Меню</span>
      <button class="menu-close" onclick="closeMenu()">✕</button>
    </div>

    <div class="side-menu-section">
      <div class="section-title" id="appearanceTitle">Вигляд</div>
      <label class="menu-toggle-row">
        <span id="categoryThemeLabel">Тема категорії світу</span>
        <input type="checkbox" id="themeToggle" onchange="onThemeToggleChange()">
      </label>
    </div>

    <div class="side-menu-section">
      <details class="menu-log-details">
        <summary class="section-title menu-log-summary" id="logTitle">📜 Історія ходів</summary>
        <div class="menu-log-list" id="menuLogList"></div>
      </details>
    </div>

    <div class="side-menu-section" id="roomMenuSection" style="display:none;">
      <button class="btn secondary" id="leaveRoomBtn" onclick="leaveRoom()">🚪 Покинути кімнату</button>
    </div>

    <div class="side-menu-section" id="multiplayerMenuSection">
      <div class="section-title" id="multiplayerTitle">Мультиплеєр</div>
      <button class="btn secondary" id="createRoomMenuBtn" onclick="openMultiplayerFromMenu('host')">➕ Створити кімнату</button>
      <button class="btn secondary" id="joinRoomMenuBtn" onclick="openMultiplayerFromMenu('join')">🔑 Приєднатися за кодом</button>
    </div>
  </div>

  <div id="onboardingView" class="view active"></div>

  <div id="storyView" class="view">
    <div id="partyPanel" style="display:none;"></div>
    <div id="status"></div>
    <div class="dice-anim" id="diceAnim">
      <div class="die-face" id="dieFace">
        <canvas id="diceCanvas" class="die-canvas"></canvas>
        <span class="die-number" id="dieNumber">?</span>
      </div>
      <div class="die-shadow" id="dieShadow"></div>
    </div>
    <div id="rollResult"></div>
    <div id="changesResult"></div>
    <div id="story">Завантаження...</div>
    <div id="options"></div>
    <button class="btn" id="diceBtn" onclick="sendManualRoll()">🎲 Кинути d20</button>
    <div id="textRow">
      <input id="freeText" placeholder="Опиши свою дію..." onkeydown="if(event.key==='Enter') sendFreeText()">
      <button id="sendBtn" onclick="sendFreeText()">➤</button>
    </div>
  </div>

  <div id="characterView" class="view">
    <div class="section-title" id="healthTitle">Здоров'я</div>
    <div id="charHp"></div>

    <div class="section-title" id="moneyTitle">Гроші</div>
    <div id="charMoney"></div>

    <div class="section-title" id="attrsTitle">Характеристики</div>
    <div id="charAttrs"></div>

    <div class="section-title" id="invTitle">Інвентар</div>
    <div id="charInventory"></div>
  </div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
// True fullscreen (Bot API 8.0+ / Telegram 7.7+): drops the native header
// bar entirely. Older clients don't have this method — fail silently and
// fall back to the regular expanded view from tg.expand() above.
try { if (tg.requestFullscreen) tg.requestFullscreen(); } catch (e) {}
// Fullscreen makes an accidental swipe-down easy to trigger right on top of
// the story text — disable the swipe-to-close gesture while in the app.
try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}

// Outside of true fullscreen, Telegram overlays its own "close" (X) button
// on top of the page instead of reserving space for it — nothing in the
// WebView API reports that header's height directly. We reserve a fixed
// buffer for it via --header-safe-top (set in CSS) and drop that buffer to
// zero only once fullscreen is confirmed active, since fullscreen removes
// that native header entirely (the real notch/status-bar inset is still
// covered separately via contentSafeAreaInset).
function applyHeaderSafeTop() {
  const fullscreen = !!tg.isFullscreen;
  document.documentElement.style.setProperty("--header-safe-top", fullscreen ? "0px" : "54px");
}
try { tg.onEvent("fullscreenChanged", applyHeaderSafeTop); } catch (e) {}
try { tg.onEvent("fullscreenFailed", applyHeaderSafeTop); } catch (e) {}
applyHeaderSafeTop();

function applyTelegramSafeArea() {
  const inset = tg.contentSafeAreaInset || tg.safeAreaInset || {};
  document.documentElement.style.setProperty("--tg-extra-top", (inset.top || 0) + "px");
  document.documentElement.style.setProperty("--tg-extra-bottom", (inset.bottom || 0) + "px");
}
try {
  tg.onEvent("safeAreaChanged", applyTelegramSafeArea);
  tg.onEvent("contentSafeAreaChanged", applyTelegramSafeArea);
} catch (e) {}
applyTelegramSafeArea();

const initData = tg.initData;
const currentUserId = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : null;

// --- Multiplayer (turn-based rooms) ---
let roomMode = false;
let roomId = null;
let myTurn = true;
let roomPollTimer = null;
let lastActiveUserId = null;
let currentLanguage = null;

// Localized UI strings for the game screen (tabs, menu, section titles,
// errors) — fetched once via /api/ui as soon as we know the game's
// language, either from /api/state (existing game) or from the wizard's
// chosen language (new game, see startAdventure()).
let gameUi = null;

function t(key, vars) {
  let template = (gameUi && gameUi[key]) || key;
  if (vars) {
    for (const [k, v] of Object.entries(vars)) {
      template = template.split(`{${k}}`).join(v);
    }
  }
  return template;
}

function localizeStaticUI() {
  document.getElementById("tabStoryBtn").textContent = "🗺️ " + t("tab_story");
  document.getElementById("tabCharBtn").textContent = "🧙 " + t("tab_character");
  document.getElementById("menuBtn").textContent = "☰ " + t("menu_label");
  document.getElementById("menuTitle").textContent = "⚙️ " + t("menu_label");
  document.getElementById("appearanceTitle").textContent = t("appearance_title");
  document.getElementById("categoryThemeLabel").textContent = t("category_theme_label");
  document.getElementById("logTitle").textContent = "📜 " + t("log_title");
  document.getElementById("healthTitle").textContent = t("health_title");
  document.getElementById("moneyTitle").textContent = t("money_title");

let lastCharacter = null;
let lastLog = [];
let diceInterval = null;
let currentThemeIcon = "";
let useCategoryTheme = localStorage.getItem("useCategoryTheme") !== "false"; // default: on

// Neutral dice look used when the person prefers Telegram's own theme
// instead of the per-category one.
const NEUTRAL_DICE = { dice: 0x5b6373, edge: 0x14151a, light: 0xffffff };

// Per-category visual theme: CSS handles colors/fonts/background via
// html[data-theme], this map covers what only JS can touch (the 3D dice
// material/edge/light colors, and a small accent icon on action buttons).
const THEMES = {
  fantasy:   { dice: 0x5a4326, edge: 0xf0c674, light: 0xffd9a0, icon: "⚔️" },
  scifi:     { dice: 0x123244, edge: 0x29d8ff, light: 0x88ccff, icon: "🛰️" },
  postapo:   { dice: 0x4a3c28, edge: 0xd9a02b, light: 0xffcf7a, icon: "☢️" },
  horror:    { dice: 0x2a0a0a, edge: 0x8a2222, light: 0xff6666, icon: "💀" },
  cyberpunk: { dice: 0x2a0a3a, edge: 0xff2fe0, light: 0x38e8ff, icon: "🤖" },
  steampunk: { dice: 0x4a3216, edge: 0xc9973e, light: 0xffcf7a, icon: "⚙️" },
};

function applyTheme(category) {
  const theme = useCategoryTheme ? THEMES[category] : null;
  document.documentElement.dataset.theme = theme ? category : "";
  currentThemeIcon = theme ? theme.icon : "";
  const diceColors = theme || NEUTRAL_DICE;
  if (dieMesh) {
    dieMesh.material.color.setHex(diceColors.dice);
    if (diceEdgeMaterial) diceEdgeMaterial.color.setHex(diceColors.edge);
    if (diceKeyLight) diceKeyLight.color.setHex(diceColors.light);
  }
}

// --- Real 3D d20 (icosahedron) via three.js ---
let scene, camera, renderer, dieMesh, diceEdgeMaterial, diceKeyLight;
let rotSpeed = { x: 0.002, y: 0.004, z: 0.001 };
let decelInterval = null;

function initDiceScene() {
  const canvas = document.getElementById("diceCanvas");
  const size = 110;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(35, 1, 0.1, 10);
  camera.position.set(0, 0, 4.2);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(size, size, false);

  const geometry = new THREE.IcosahedronGeometry(1.15, 0); // radius, detail=0 -> exactly 20 faces
  const material = new THREE.MeshPhongMaterial({
    color: 0x5b6373,
    flatShading: true,
    shininess: 30,
    specular: 0x333333,
  });
  dieMesh = new THREE.Mesh(geometry, material);
  scene.add(dieMesh);

  const edges = new THREE.EdgesGeometry(geometry);
  diceEdgeMaterial = new THREE.LineBasicMaterial({ color: 0x14151a });
  const edgeLines = new THREE.LineSegments(edges, diceEdgeMaterial);
  dieMesh.add(edgeLines);

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  diceKeyLight = new THREE.DirectionalLight(0xffffff, 0.9);
  diceKeyLight.position.set(2, 3, 4);
  scene.add(diceKeyLight);
  const fill = new THREE.DirectionalLight(0x88aaff, 0.35);
  fill.position.set(-3, -1, -2);
  scene.add(fill);

  renderDiceLoop();
}

function renderDiceLoop() {
  requestAnimationFrame(renderDiceLoop);
  if (!dieMesh) return;
  dieMesh.rotation.x += rotSpeed.x;
  dieMesh.rotation.y += rotSpeed.y;
  dieMesh.rotation.z += rotSpeed.z;
  renderer.render(scene, camera);
}

function startDiceAnimation(sides) {
  const wrap = document.getElementById("diceAnim");
  const face = document.getElementById("dieFace");
  const shadow = document.getElementById("dieShadow");
  const number = document.getElementById("dieNumber");
  clearInterval(decelInterval);
  wrap.style.display = "flex";
  face.classList.remove("settled");
  shadow.classList.remove("settled");
  shadow.classList.add("spinning");
  rotSpeed = { x: 0.18, y: 0.24, z: 0.1 };
  number.textContent = "?";
  diceInterval = setInterval(() => {
    number.textContent = String(1 + Math.floor(Math.random() * sides));
  }, 70);
}

function stopDiceAnimation(finalValue) {
  return new Promise(resolve => {
    clearInterval(diceInterval);
    const wrap = document.getElementById("diceAnim");
    const face = document.getElementById("dieFace");
    const shadow = document.getElementById("dieShadow");
    const number = document.getElementById("dieNumber");

    number.textContent = String(finalValue ?? "?");
    shadow.classList.remove("spinning");
    shadow.classList.add("settled");
    face.classList.add("settled");

    // Ease the spin down to a slow idle instead of stopping abruptly.
    decelInterval = setInterval(() => {
      rotSpeed.x *= 0.85;
      rotSpeed.y *= 0.85;
      rotSpeed.z *= 0.85;
      if (Math.abs(rotSpeed.y) < 0.004) {
        clearInterval(decelInterval);
        rotSpeed = { x: 0.002, y: 0.004, z: 0.001 };
      }
    }, 40);

    setTimeout(() => {
      wrap.style.display = "none";
      face.classList.remove("settled");
      shadow.classList.remove("settled");
      resolve();
    }, 650);
  });
}

function startRoomPolling() {
  stopRoomPolling();
  roomPollTimer = setInterval(async () => {
    if (!roomMode) return;
    const data = await api("/api/room/state", {});
    if (data.error) return;

    const inLobbyView = document.getElementById("onboardingView").classList.contains("active");

    if (!data.started) {
      // Still in the lobby — refresh the seat list so a host sees new
      // joiners show up, and anyone sees the host's display stay current.
      if (inLobbyView) renderLobby(data);
      return;
    }

    // The host just pressed "start" (or this is an ongoing game) — if we
    // were showing the lobby, switch over to the story view now.
    const justStarted = inLobbyView;
    const changed = justStarted || (data.log && data.log.length !== lastLog.length) || data.active_user_id !== lastActiveUserId;
    lastActiveUserId = data.active_user_id;
    if (changed) {
      if (justStarted) {
        document.getElementById("onboardingView").classList.remove("active");
        document.getElementById("storyView").classList.add("active");
        showTabs(true);
      }
      await applyState(data);
    } else {
      renderParty(data.party, data.active_user_id);
    }
  }, 4000);
}

// Mirrors dice.py / core.py's modifier formulas, so the button preview
// always matches what the server will actually apply when rolled.
function hpPenalty(hp, maxHp) {
  if (!maxHp || maxHp <= 0) return 0;
  const ratio = hp / maxHp;
  if (ratio <= 0.2) return -2;
  if (ratio <= 0.45) return -1;
  return 0;
}

function attributeModifier(value) {
  const v = parseFloat(value);
  if (isNaN(v)) return 0;
  if (v <= 2) return -2;
  if (v <= 4) return -1;
  if (v <= 6) return 0;
  if (v <= 8) return 1;
  return 2;
}

function computeModifier(character, attribute) {
  const hp = character?.hp ?? 30;
  const maxHp = character?.max_hp ?? 30;
  let modifier = hpPenalty(hp, maxHp);
  if (attribute && character?.attributes && character.attributes[attribute] !== undefined) {
    modifier += attributeModifier(character.attributes[attribute]);
  }
  return modifier;
}

function renderOptions(options) {
  const el = document.getElementById("options");
  el.innerHTML = "";
  (options || []).forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "btn";
    const prefix = currentThemeIcon ? currentThemeIcon + " " : "";
    let label = prefix + (i + 1) + ") " + opt.text;
    if (opt.requires_roll) {
      const modifier = computeModifier(lastCharacter, opt.attribute);
      label += modifier ? ` 🎲${modifier > 0 ? "+" : ""}${modifier}` : " 🎲";
    }
    btn.textContent = label;
    btn.onclick = () => sendChoice(i + 1, opt.requires_roll);
    el.appendChild(btn);
  });
}

function tierLabel(tier) {

    critical_failure: "💥", failure: "❌", partial_success: "➖",
    success: "✅", critical_success: "🌟",
  }[tier] || "";
  return `${emoji} ${t("tier_" + tier)}`.trim();
}

function renderRoll(roll) {
  const el = document.getElementById("rollResult");
  if (!roll) { el.innerHTML = ""; return; }
  const modifierText = roll.modifier ? ` (${roll.modifier > 0 ? "+" : ""}${roll.modifier})` : "";
  const rollLine = t("dice_roll_label", { sides: roll.sides }) + `: ${roll.value}${modifierText}`;
  const totalLine = t("dice_total", { total: roll.total });
  el.innerHTML = `<div class="roll-card">${rollLine}<br>${totalLine}<br>${tierLabel(roll.tier)}</div>`;
}

function renderChanges(changes) {
  const el = document.getElementById("changesResult");
  if (!changes) { el.innerHTML = ""; return; }
  const parts = [];
  if (changes.hp_delta) {
    const cls = changes.hp_delta > 0 ? "positive" : "negative";
    parts.push(`<span class="delta ${cls}">❤️ ${changes.hp_delta > 0 ? "+" : ""}${changes.hp_delta}</span>`);
  }
  if (changes.money_delta) {
    const cls = changes.money_delta > 0 ? "positive" : "negative";
    parts.push(`<span class="delta ${cls}">💰 ${changes.money_delta > 0 ? "+" : ""}${changes.money_delta}</span>`);
  } else if (changes.money_note) {
    parts.push(`<span class="delta">💰 ${escapeHtml(changes.money_note)}</span>`);
  }
  (changes.inventory_added || []).forEach(item =>
    parts.push(`<span class="delta positive">🎒 +${escapeHtml(item)}</span>`));
  (changes.inventory_removed || []).forEach(item =>
    parts.push(`<span class="delta negative">🎒 -${escapeHtml(item)}</span>`));
  el.innerHTML = parts.length ? `<div class="changes-row">${parts.join("")}</div>` : "";
}

function renderCharacterView() {
  const c = lastCharacter || {};

  // HP bar
  const hp = c.hp ?? 0;
  const maxHp = c.max_hp ?? 0;
  const pct = maxHp > 0 ? Math.max(0, Math.min(100, (hp / maxHp) * 100)) : 0;
  document.getElementById("charHp").innerHTML = `
    <div class="hp-label"><span>${hp} / ${maxHp}</span></div>
    <div class="hp-bar-track"><div class="hp-bar-fill" style="width:${pct}%"></div></div>
  `;

  // Money
  document.getElementById("charMoney").innerHTML = c.money
    ? `<div class="money-line">💰 ${c.money}</div>`
    : `<div class="empty-note">${t("unknown_value")}</div>`;

  // Attributes
  const attrs = c.attributes || {};
  const attrKeys = Object.keys(attrs);
  const attrsEl = document.getElementById("charAttrs");
  if (!attrKeys.length) {
    attrsEl.innerHTML = `<div class="empty-note">${t("no_data_note")}</div>`;
  } else {
    attrsEl.innerHTML = attrKeys.map(key => {
      const raw = attrs[key];
      const value = typeof raw === "number" ? raw : parseFloat(raw) || 0;
      const barPct = Math.max(0, Math.min(100, (value / 10) * 100));
      return `
        <div class="attr-row">
          <div class="attr-name">${key}</div>
          <div class="attr-bar-track"><div class="attr-bar-fill" style="width:${barPct}%"></div></div>
          <div class="attr-value">${raw}</div>
        </div>
      `;
    }).join("");
  }

  // Inventory
  const items = c.inventory || [];
  const invEl = document.getElementById("charInventory");
  if (!items.length) {
    invEl.innerHTML = `<div class="empty-note">${t("empty_note_generic")}</div>`;
  } else {
    invEl.innerHTML = `<div class="inv-grid">` +
      items.map(item => `<div class="inv-item">🎒 ${item}</div>`).join("") +
      `</div>`;
  }
}

function renderMenuLog() {

    const text = entry.replace(/^\[(Player|Гравець|DM)\]:\s*/, "");
    return `<div class="log-entry ${isPlayer ? "player" : "dm"}">${escapeHtml(text)}</div>`;

async function applyState(data) {
  lastCharacter = data.character || null;
  if (data.log) lastLog = data.log;
  if (data.room_id) roomId = data.room_id;
  if (data.language) currentLanguage = data.language;
  if (data.language && !gameUi) {
    gameUi = await fetch(`/api/ui?lang=${data.language}`).then(r => r.json());
    localizeStaticUI();
  }
  applyTheme(lastCharacter && lastCharacter.category);
  renderStatus(data.character);
  renderStory(data.text);
  renderParty(data.party, data.active_user_id);
  lastActiveUserId = data.active_user_id;

  const canAct = !roomMode || data.active_user_id == null || data.active_user_id === currentUserId;
  setActionControlsEnabled(canAct);
  if (canAct) renderOptions(data.options);

  if (document.getElementById("characterView").classList.contains("active")) {
    renderCharacterView();
  }
  if (document.getElementById("sideMenu").classList.contains("open")) {
    renderMenuLog();
  }
}

function setBusy(busy) {
  document.getElementById("diceBtn").disabled = busy;
  document.getElementById("sendBtn").disabled = busy;
}

function setLoading() {
  renderRoll(null);
  renderChanges(null);
  document.getElementById("options").innerHTML = "";
  renderStory("...");
}

async function loadState() {
  const roomData = await api("/api/room/state", {});
  if (!roomData.error) {
    roomMode = true;
    if (roomData.language) currentLanguage = roomData.language;
    if (roomData.language && !gameUi) {
      gameUi = await fetch(`/api/ui?lang=${roomData.language}`).then(r => r.json());
      localizeStaticUI();
    }
    if (!roomData.started) {
      renderLobby(roomData);
      startRoomPolling();
      return;
    }
    showTabs(true);
    document.getElementById("onboardingView").classList.remove("active");
    document.getElementById("storyView").classList.add("active");
    lastActiveUserId = roomData.active_user_id;
    await applyState(roomData);
    startRoomPolling();
    return;
  }
  if (roomData.error === "unauthorized") {
    showTabs(false);
    document.getElementById("onboardingView").classList.add("active");
    document.getElementById("onboardingView").innerHTML =
      `<div class="wiz-loading">${t("unauthorized_note")}</div>`;
    return;
  }

  const data = await api("/api/state", {});
  if (data.error === "no_active_game") {
    startOnboarding();
    return;
  }
  if (data.error) {
    showTabs(false);
    document.getElementById("onboardingView").classList.add("active");
    document.getElementById("onboardingView").innerHTML =
      `<div class="wiz-loading">${t("unauthorized_note")}</div>`;
    return;
  }
  roomMode = false;
  showTabs(true);
  document.getElementById("onboardingView").classList.remove("active");
  document.getElementById("storyView").classList.add("active");
  await applyState(data);
}

function handleActionResult(data) {
  if (data.error) {
    if (data.error === "not_your_turn") {
      // Someone else's turn started (or finished) while we were mid-action —
      // just resync from the server instead of showing a scary error.
      renderRoll(null);
      lastActiveUserId = data.active_user_id;
      renderParty(data.party, data.active_user_id);
      setActionControlsEnabled(data.active_user_id === currentUserId);
      return;
    }
    const message = data.error === "content_blocked"
      ? t("content_blocked")
      : t("error_prefix") + (data.detail || data.error);
    renderStory(message);
    renderRoll(null);
    // The failed turn was never saved server-side, so the options/character
    // sent back here are still the previous valid ones — restore the
    // buttons instead of leaving the player with no way to proceed.
    if (data.character) {
      lastCharacter = data.character;
      renderStatus(data.character);
      applyTheme(lastCharacter && lastCharacter.category);
    }
    if (data.party) renderParty(data.party, data.active_user_id);
    if (data.options) renderOptions(data.options);
    return;
  }
  renderRoll(data.roll);
  renderChanges(data.changes);
  applyState(data);
  if (data.defeated) {
    document.getElementById("story").textContent += "\n\n" + t("defeated_miniapp");
  }
}

async function sendChoice(index, requiresRoll) {
  if (roomMode && !myTurn) return;
  setBusy(true);
  try {
    if (requiresRoll) startDiceAnimation(20);
    setLoading();
    const data = await api(actionPath(), { type: "choice", index });
    if (requiresRoll) await stopDiceAnimation(data.roll ? data.roll.value : null);
    handleActionResult(data);
  } finally {
    setBusy(false);
  }
}

async function sendManualRoll() {
  if (roomMode && !myTurn) return;
  setBusy(true);
  try {
    startDiceAnimation(20);
    setLoading();
    const data = await api(actionPath(), { type: "roll", sides: 20 });
    await stopDiceAnimation(data.roll ? data.roll.value : null);
    handleActionResult(data);
  } finally {
    setBusy(false);
  }
}

async function sendFreeText() {
  if (roomMode && !myTurn) return;
  const input = document.getElementById("freeText");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  setBusy(true);
  try {
    setLoading();
    const data = await api(actionPath(), { type: "text", text });
    handleActionResult(data);
  } finally {
    setBusy(false);
  }
}

// ---------------------------------------------------------------------------
// Onboarding wizard: language -> category -> world -> character -> start
// ---------------------------------------------------------------------------

let wizard = {
  language: null,
  uiStrings: null,
  category: null,
  worldDescription: null,
  characterDescription: null,
  gender: null,
  age: null,
  currentPreview: null,
  multiplayer: null, // null = solo, "host" = creating a room, "join" = joining one
  roomId: null,
};

function onboardingHTML(html) {
  document.getElementById("onboardingView").innerHTML = html;
}

function showWizardError(data) {
  const w = wizard.uiStrings || {};
  const template = w.gemini_error || "Error: {error}";
  const msg = template.replace("{error}", data.detail || data.error || "unknown");
  const retryLabel = w.retry_button || "🔄 Retry";
  onboardingHTML(
    `<div class="wiz-loading">${escapeHtml(msg)}</div>` +
    `<button class="btn" onclick="startOnboarding()">${escapeHtml(retryLabel)}</button>`
  );
}

function startOnboarding() {
  cameFromActiveGame = false;
  wizard = {
    language: null, uiStrings: null, category: null, worldDescription: null,
    characterDescription: null, gender: null, age: null, currentPreview: null,
    multiplayer: null, roomId: null,
  };
  applyTheme(null);
  showTabs(false);
  closeMenu();
  document.getElementById("partyPanel").style.display = "none";
  document.getElementById("storyView").classList.remove("active");
  document.getElementById("characterView").classList.remove("active");
  document.getElementById("onboardingView").classList.add("active");
  renderLanguageStep();
}

function renderLanguageStep() {
  onboardingHTML(`
    <div class="wiz-title">🌐 Choose language / Обери мову / Выбери язык / Wybierz język</div>
    <div id="langButtons"></div>
  `);
  fetch("/api/languages").then(r => r.json()).then(languages => {
    document.getElementById("langButtons").innerHTML = languages
      .map(l => `<button class="btn" onclick="selectLanguage('${l.key}')">${l.label}</button>`)
      .join("");
  });
}

async function selectLanguage(key) {
  wizard.language = key;
  onboardingHTML(`<div class="wiz-loading">...</div>`);
  wizard.uiStrings = await fetch(`/api/ui?lang=${key}`).then(r => r.json());
  renderModeStep();
}

function renderModeStep() {
  const t = wizard.uiStrings;
  onboardingHTML(`
    <div class="wiz-title">${escapeHtml(t.mode_prompt)}</div>
    <button class="btn" onclick="chooseSoloMode()">${escapeHtml(t.mode_solo)}</button>
    <button class="btn" onclick="chooseCreateRoomMode()">${escapeHtml(t.mode_create_room)}</button>
    <button class="btn secondary" onclick="renderJoinRoomStep()">${escapeHtml(t.mode_join_room)}</button>
  `);
}

async function chooseSoloMode() {
  wizard.multiplayer = null;
  const categories = await fetch(`/api/categories?lang=${wizard.language}`).then(r => r.json());
  renderCategoryStep(categories);
}

async function chooseCreateRoomMode() {
  wizard.multiplayer = "host";
  const categories = await fetch(`/api/categories?lang=${wizard.language}`).then(r => r.json());
  renderCategoryStep(categories);
}

function renderJoinRoomStep() {
  const t = wizard.uiStrings;
  onboardingHTML(`
    <div class="wiz-title">${escapeHtml(t.room_code_prompt)}</div>
    <input class="wiz-input" id="roomCodeInput" placeholder="${escapeHtml(t.room_code_placeholder)}" style="text-transform:uppercase">
    <button class="btn" onclick="submitRoomCode()">${escapeHtml(t.continue_button)}</button>
    ${cancelButtonHtml()}
  `);
}

function submitRoomCode() {
  const code = document.getElementById("roomCodeInput").value.trim().toUpperCase();
  if (!code) return;
  wizard.multiplayer = "join";
  wizard.roomId = code;
  renderCharacterMethodStep();
}

function renderCategoryStep(categories) {
  const t = wizard.uiStrings;
  onboardingHTML(`
    <div class="wiz-title">${escapeHtml(t.choose_category)}</div>
    <div id="catButtons"></div>
    ${cancelButtonHtml()}
  `);
  document.getElementById("catButtons").innerHTML = categories
    .map(c => `<button class="btn" onclick="selectCategory('${c.key}')">${escapeHtml(c.label)}</button>`)
    .join("");
}

function selectCategory(key) {
  wizard.category = key;
  renderWorldStep();
}

function renderWorldStep() {
  const t = wizard.uiStrings;
  onboardingHTML(`
    <div class="wiz-title">${escapeHtml(t.describe_world)}</div>
    <textarea class="wiz-textarea" id="worldInput"></textarea>
    <button class="btn" onclick="submitWorldText()">${escapeHtml(t.continue_button)}</button>
    <button class="btn secondary" onclick="requestWorldPreview()">${escapeHtml(t.world_random_button)}</button>
    ${cancelButtonHtml()}
  `);
}

function submitWorldText() {
  const text = document.getElementById("worldInput").value.trim();
  wizard.worldDescription = text || null;
  renderCharacterMethodStep();
}

async function requestWorldPreview() {
  const t = wizard.uiStrings;
  onboardingHTML(`<div class="wiz-loading">${escapeHtml(t.generating_preview)}</div>`);
  const data = await api("/api/preview/world", { language: wizard.language, category: wizard.category });
  if (data.error) { showWizardError(data); return; }
  wizard.currentPreview = data.preview;
  onboardingHTML(`
    <div class="wiz-title">${escapeHtml(t.describe_world)}</div>
    <div class="preview-card">${escapeHtml(data.preview)}</div>
    <button class="btn secondary" onclick="requestWorldPreview()">${escapeHtml(t.preview_regen_button)}</button>
    <button class="btn" onclick="acceptWorldPreview()">${escapeHtml(t.preview_accept_button)}</button>
  `);
}

function acceptWorldPreview() {
  wizard.worldDescription = wizard.currentPreview;
  renderCharacterMethodStep();
}

function renderCharacterMethodStep() {
  const t = wizard.uiStrings;
  onboardingHTML(`
    <div class="wiz-title">${escapeHtml(t.character_method_prompt)}</div>
    <button class="btn" onclick="renderCharacterManualStep()">${escapeHtml(t.character_manual_button)}</button>
    <button class="btn secondary" onclick="renderGenderStep()">${escapeHtml(t.character_random_button)}</button>
    ${cancelButtonHtml()}
  `);
}

function renderCharacterManualStep() {
  const t = wizard.uiStrings;
  onboardingHTML(`
    <div class="wiz-title">${escapeHtml(t.describe_character_prompt)}</div>
    <textarea class="wiz-textarea" id="charInput"></textarea>
    <button class="btn" onclick="submitCharacterText()">${escapeHtml(t.continue_button)}</button>
  `);
}

function submitCharacterText() {
  const text = document.getElementById("charInput").value.trim();
  wizard.characterDescription = text || null;
  startAdventure();
}

function renderGenderStep() {
  const t = wizard.uiStrings;
  onboardingHTML(`
    <div class="wiz-title">${escapeHtml(t.choose_gender)}</div>
    <button class="btn" onclick="selectGender('male')">${escapeHtml(t.gender_male)}</button>
    <button class="btn" onclick="selectGender('female')">${escapeHtml(t.gender_female)}</button>
    <button class="btn secondary" onclick="selectGender('any')">${escapeHtml(t.gender_any)}</button>
  `);
}

function selectGender(g) {
  wizard.gender = g;
  renderAgeStep();
}

function renderAgeStep() {
  const t = wizard.uiStrings;
  onboardingHTML(`
    <div class="wiz-title">${escapeHtml(t.enter_age_prompt)}</div>
    <input class="wiz-input" id="ageInput" placeholder="27">
    <button class="btn" onclick="submitAge()">${escapeHtml(t.continue_button)}</button>
  `);
}

function submitAge() {
  const value = document.getElementById("ageInput").value.trim();
  wizard.age = value || "any";
  if (wizard.multiplayer === "join") {
    // Joining an in-progress room: there's no wizard.category/worldDescription
    // on this client (the joiner never picks those — the room already has
    // them), so the generic preview endpoint can't be used here. The server
    // generates a fitting character directly from the room's own world when
    // /api/room/join is called, so just submit straight away.
    startAdventure();
  } else {
    requestCharacterPreview();
  }
}

async function requestCharacterPreview() {
  const t = wizard.uiStrings;
  onboardingHTML(`<div class="wiz-loading">${escapeHtml(t.generating_preview)}</div>`);
  const data = await api("/api/preview/character", {
    language: wizard.language,
    category: wizard.category,
    gender: wizard.gender,
    age: wizard.age,
    world_description: wizard.worldDescription,
  });
  if (data.error) { showWizardError(data); return; }
  wizard.currentPreview = data.preview;
  onboardingHTML(`
    <div class="wiz-title">${escapeHtml(t.character_method_prompt)}</div>
    <div class="preview-card">${escapeHtml(data.preview)}</div>
    <button class="btn secondary" onclick="requestCharacterPreview()">${escapeHtml(t.preview_regen_button)}</button>
    <button class="btn" onclick="acceptCharacterPreview()">${escapeHtml(t.preview_accept_button)}</button>
  `);
}

function acceptCharacterPreview() {
  wizard.characterDescription = wizard.currentPreview;
  startAdventure();
}

async function startAdventure() {
  const t = wizard.uiStrings;
  onboardingHTML(`<div class="wiz-loading">${escapeHtml(t.creating)}</div>`);

  let data;
  if (wizard.multiplayer === "host") {
    data = await api("/api/room/create", {
      language: wizard.language,
      category: wizard.category,
      world_description: wizard.worldDescription,
      character_description: wizard.characterDescription,
      gender: wizard.gender,
      age: wizard.age,
    });
  } else if (wizard.multiplayer === "join") {
    data = await api("/api/room/join", {
      room_id: wizard.roomId,
      character_description: wizard.characterDescription,
      gender: wizard.gender,
      age: wizard.age,
    });
  } else {
    data = await api("/api/create", {
      language: wizard.language,
      category: wizard.category,
      world_description: wizard.worldDescription,
      character_description: wizard.characterDescription,
      gender: wizard.gender,
      age: wizard.age,
    });
  }

  if (data.error) { showWizardError(data); return; }
  gameUi = wizard.uiStrings;
  currentLanguage = wizard.language;
  cameFromActiveGame = false;
  localizeStaticUI();
  roomMode = wizard.multiplayer === "host" || wizard.multiplayer === "join";
  roomId = data.room_id || wizard.roomId || null;

  if (roomMode && !data.started) {
    // Lobby: the shared opening scene waits until the host presses "start"
    // (see renderLobby), so everyone who wants to join in time still can.
    renderLobby(data);
    startRoomPolling();
    return;
  }

  document.getElementById("onboardingView").classList.remove("active");
  document.getElementById("storyView").classList.add("active");
  showTabs(true);
  lastActiveUserId = data.active_user_id;
  await applyState(data);
  if (roomMode) startRoomPolling();
}

initDiceScene();
loadState();
</script>
