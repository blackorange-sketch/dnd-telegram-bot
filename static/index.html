<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DnD Adventure</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Orbitron:wght@600;800&family=Creepster&family=Audiowide&family=Special+Elite&family=Metal+Mania&family=Courier+Prime:wght@700&family=Rye&family=Pirata+One&family=Yeseva+One&family=Ruslan+Display&family=Russo+One&family=Stalinist+One&family=Rampart+One&family=Jura:wght@600;700&family=Philosopher:wght@700&family=Underdog&family=Montserrat+Alternates:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--tg-theme-bg-color, #17181c);
    --text: var(--tg-theme-text-color, #f2f2f2);
    --hint: var(--tg-theme-hint-color, #8b8b8f);
    --btn: #1a56c7;
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: rgba(255, 255, 255, 0.06);
    --hp: #e5484d;
    --attr: #2ea6ff;
    --font-heading: inherit;
    --bg-image: none;
    --tg-extra-top: 0px;
    --tg-extra-bottom: 0px;
    /* Reserve room for Telegram's native "close" button, which floats over
       the page when true fullscreen isn't active (older clients, or before
       requestFullscreen() resolves). Zeroed out once fullscreen is confirmed
       — see applyHeaderSafeTop() in the script below. */
    --header-safe-top: 56px;
  }

  /* --- Per-category themes, applied via html[data-theme="..."] --- */
  /* Used before a category is chosen yet (language/mode picker, room lobby,
     character creation) so the very first screens match the same visual
     language as the game itself, instead of a plain generic gray. */
  html[data-theme="default"] {
    --bg: #0f0f1a; --card: rgba(167, 139, 250, 0.10); --btn: #4c3a8a;
    --btn-text: #f3e9ff; --hint: #9a93c9; --hp: #e5484d; --attr: #c9a4ff;
    --text: #ece9f7; --font-heading: 'Cinzel', serif;
    --btn-glow: inset 0 0 0 1px rgba(201,164,255,0.4);
    --bg-image: radial-gradient(circle at 20% 15%, rgba(201,164,255,0.12), transparent 45%),
                radial-gradient(circle at 80% 85%, rgba(76,58,138,0.18), transparent 50%);
  }
  html[data-theme="fantasy"] {
    --bg: #1c140c; --card: rgba(196, 154, 84, 0.14); --btn: #6b3f1d;
    --btn-text: #f4e4c1; --hint: #b89968; --hp: #c0392b; --attr: #d4af5a;
    --text: #f0e6d2; --font-heading: 'Cinzel', serif;
    --btn-glow: inset 0 0 0 1px rgba(212,175,90,0.4);
    --bg-image: radial-gradient(circle at 15% 10%, rgba(212,175,90,0.10), transparent 42%),
                radial-gradient(circle at 85% 90%, rgba(107,63,29,0.16), transparent 48%);
  }
  html[data-theme="scifi"] {
    --bg: #060f18; --card: rgba(46, 166, 255, 0.10); --btn: #0e5a78;
    --btn-text: #d9faff; --hint: #6fa8c9; --hp: #ff5470; --attr: #2ea6ff;
    --text: #dff6ff; --font-heading: 'Orbitron', sans-serif;
    --btn-glow: 0 0 10px rgba(46,166,255,0.45), inset 0 0 0 1px rgba(46,166,255,0.5);
    --bg-image: repeating-linear-gradient(90deg, rgba(46,166,255,0.05) 0 1px, transparent 1px 48px),
                repeating-linear-gradient(0deg, rgba(46,166,255,0.05) 0 1px, transparent 1px 48px);
  }
  html[data-theme="postapo"] {
    --bg: #161512; --card: rgba(214, 158, 46, 0.10); --btn: #7a4a12;
    --btn-text: #fff3d6; --hint: #a08c6e; --hp: #d94f2b; --attr: #d9a02b;
    --text: #ece3d2; --font-heading: 'Metal Mania', cursive;
    --btn-glow: inset 0 0 0 1px rgba(217,160,43,0.35);
    --bg-image: radial-gradient(circle at 25% 20%, rgba(217,79,43,0.10), transparent 40%),
                radial-gradient(circle at 75% 75%, rgba(217,160,43,0.08), transparent 45%);
  }
  html[data-theme="horror"] {
    --bg: #0d0505; --card: rgba(139, 0, 0, 0.16); --btn: #4a0e0e;
    --btn-text: #e8d9c8; --hint: #8a6a6a; --hp: #d94f4f; --attr: #b23a3a;
    --text: #e8d9c8; --font-heading: 'Creepster', cursive;
    --btn-glow: inset 0 0 0 1px rgba(178,58,58,0.4);
    --bg-image: radial-gradient(circle at 50% 0%, rgba(139,0,0,0.18), transparent 55%);
  }
  html[data-theme="cyberpunk"] {
    --bg: #08040f; --card: rgba(217, 70, 239, 0.10); --btn: #7a1fa2;
    --btn-text: #fdeeff; --hint: #a875c9; --hp: #ff2f92; --attr: #38e8ff;
    --text: #f2e8ff; --font-heading: 'Audiowide', sans-serif;
    --btn-glow: 0 0 14px rgba(255,47,224,0.5), inset 0 0 0 1px rgba(56,232,255,0.6);
    --bg-image: linear-gradient(180deg, rgba(217,70,239,0.08), transparent 30%),
                repeating-linear-gradient(90deg, rgba(56,232,255,0.04) 0 2px, transparent 2px 40px);
  }
  html[data-theme="steampunk"] {
    --bg: #17110a; --card: rgba(184, 134, 66, 0.14); --btn: #6e4a1f;
    --btn-text: #f5e8cf; --hint: #b08a55; --hp: #c0392b; --attr: #c9973e;
    --text: #f0e2c8; --font-heading: 'Special Elite', cursive;
    --btn-glow: inset 0 0 0 1px rgba(201,151,62,0.45);
    --bg-image: radial-gradient(circle at 20% 85%, rgba(201,151,62,0.10), transparent 42%),
                radial-gradient(circle at 80% 15%, rgba(110,74,31,0.14), transparent 46%);
  }
  html[data-theme="detective"] {
    --bg: #15140f; --card: rgba(214, 196, 150, 0.10); --btn: #4a4235;
    --btn-text: #f2e9d6; --hint: #9a8f78; --hp: #a8444a; --attr: #c9b26a;
    --text: #e9e2cf; --font-heading: 'Courier Prime', monospace;
    --btn-glow: inset 0 0 0 1px rgba(201,178,106,0.35);
    --bg-image: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.05), transparent 40%),
                repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 4px);
  }
  html[data-theme="western"] {
    --bg: #1c140b; --card: rgba(196, 140, 68, 0.14); --btn: #7a4a22;
    --btn-text: #fbe9c8; --hint: #bf9a68; --hp: #a8362c; --attr: #c98a3e;
    --text: #f1dfb9; --font-heading: 'Rye', cursive;
    --btn-glow: inset 0 0 0 1px rgba(201,138,62,0.4);
    --bg-image: radial-gradient(circle at 15% 85%, rgba(201,138,62,0.12), transparent 44%),
                radial-gradient(circle at 85% 10%, rgba(122,74,34,0.16), transparent 46%);
  }
  html[data-theme="pirates"] {
    --bg: #081821; --card: rgba(224, 182, 86, 0.10); --btn: #0e5245;
    --btn-text: #fdf3d8; --hint: #7fa6a3; --hp: #d9534f; --attr: #e0b656;
    --text: #e7f2ee; --font-heading: 'Pirata One', cursive;
    --btn-glow: inset 0 0 0 1px rgba(224,182,86,0.4);
    --bg-image: radial-gradient(circle at 20% 90%, rgba(14,82,69,0.22), transparent 48%),
                radial-gradient(circle at 85% 10%, rgba(224,182,86,0.10), transparent 42%);
  }
  /* --- Cyrillic alternates (Ukrainian/Russian) for the decorative heading
     fonts above --- */
  /* Most of the display/decorative fonts picked per theme (Cinzel,
     Creepster, Metal Mania, Audiowide, Special Elite, Rye, Pirata One,
     Orbitron) only ship Latin glyphs on Google Fonts — there's no true
     Cyrillic version of most of these specific decorative typefaces. For
     uk/ru we swap in a different, separately-chosen Google Font per theme
     that's close in mood and does have full Cyrillic support, applied via
     this [data-lang] attribute (set from the player's chosen language,
     independent of [data-theme]). English/Polish are untouched and keep the
     original fonts above; this never touches the story narration text
     itself (#story has its own plain font, not --font-heading). The
     "detective" theme is deliberately not overridden here — Courier Prime
     has no Cyrillic glyphs, so the browser already falls back to the plain
     "monospace" generic listed right after it, which still reads as a
     typewriter font and needs no Cyrillic-specific pick. */
  html[data-lang="uk"][data-theme="default"], html[data-lang="ru"][data-theme="default"] {
    --font-heading: 'Yeseva One', serif;
  }
  html[data-lang="uk"][data-theme="fantasy"], html[data-lang="ru"][data-theme="fantasy"] {
    --font-heading: 'Ruslan Display', serif;
  }
  html[data-lang="uk"][data-theme="scifi"], html[data-lang="ru"][data-theme="scifi"] {
    --font-heading: 'Russo One', sans-serif;
  }
  html[data-lang="uk"][data-theme="postapo"], html[data-lang="ru"][data-theme="postapo"] {
    --font-heading: 'Stalinist One', cursive;
  }
  html[data-lang="uk"][data-theme="horror"], html[data-lang="ru"][data-theme="horror"] {
    --font-heading: 'Rampart One', cursive;
  }
  html[data-lang="uk"][data-theme="cyberpunk"], html[data-lang="ru"][data-theme="cyberpunk"] {
    --font-heading: 'Jura', sans-serif;
  }
  html[data-lang="uk"][data-theme="steampunk"], html[data-lang="ru"][data-theme="steampunk"] {
    --font-heading: 'Philosopher', serif;
  }
  html[data-lang="uk"][data-theme="western"], html[data-lang="ru"][data-theme="western"] {
    --font-heading: 'Underdog', cursive;
  }
  html[data-lang="uk"][data-theme="pirates"], html[data-lang="ru"][data-theme="pirates"] {
    --font-heading: 'Montserrat Alternates', sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background-color: var(--bg);
    background-image: var(--bg-image);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: background-color 0.4s ease, color 0.4s ease;
  }
  body {
    padding: 16px;
    padding-top: calc(16px + env(safe-area-inset-top, 0px) + var(--tg-extra-top, 0px) + var(--header-safe-top, 0px));
    padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px) + var(--tg-extra-bottom, 0px));
  }

  /* --- Tabs (fixed bottom bar) --- */
  #tabs {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    gap: 8px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px) + var(--tg-extra-bottom, 0px));
    background: var(--bg);
    border-top: 1px solid var(--card);
    z-index: 10;
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: var(--card);
    color: var(--hint);
    font-size: 14px;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--btn);
    color: var(--btn-text);
  }
  .view { display: none; }

  /* --- Side menu (settings drawer) --- */
  .menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 20;
  }
  .menu-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }
  .side-menu {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(300px, 82vw);
    background: var(--bg);
    border-left: 1px solid var(--card);
    transform: translateX(100%);
    transition: transform 0.28s ease;
    z-index: 21;
    padding: calc(16px + env(safe-area-inset-top, 0px) + var(--tg-extra-top, 0px) + var(--header-safe-top, 0px)) 16px 16px;
    overflow-y: auto;
  }
  .side-menu.open { transform: translateX(0); }
  .side-menu-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    font-size: 17px;
    font-weight: 700;
    font-family: var(--font-heading);
  }
  .menu-close {
    background: none;
    border: none;
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
  }
  .side-menu-section { margin-bottom: 22px; }
  .menu-toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--card);
    cursor: pointer;
  }
  .menu-toggle-row input { transform: scale(1.15); }
  .menu-log-details { margin: 0; }
  .side-menu-section .menu-log-summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--card);
    cursor: pointer;
    margin: 0;
    list-style: none;
  }
  .menu-log-summary::-webkit-details-marker { display: none; }
  .menu-log-summary::after {
    content: "▸";
    color: var(--hint);
    transition: transform 0.2s ease;
  }
  .menu-log-details[open] .menu-log-summary::after {
    transform: rotate(90deg);
  }
  .menu-log-list {
    max-height: 40vh;
    overflow-y: auto;
    margin-top: 8px;
  }
  .view.active { display: block; }

  /* --- Story view --- */
  #status {
    font-size: 14px;
    color: var(--hint);
    margin-bottom: 14px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  #rollResult { margin-bottom: 12px; }
  .roll-card {
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--card);
    font-size: 15px;
  }
  #changesResult { margin-bottom: 12px; }
  .changes-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .delta {
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    background: var(--card);
  }
  .delta.positive { color: #3ecf6e; }
  .delta.negative { color: #e5484d; }
  .dice-anim {
    display: none;
    flex-direction: column;
    align-items: center;
    margin-bottom: 16px;
    perspective: 600px;
  }
  .die-face {
    width: 110px;
    height: 110px;
    position: relative;
  }
  .die-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .die-number {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    pointer-events: none;
  }
  .die-face.settled {
    animation: dice-pop 0.35s ease;
  }
  @keyframes dice-pop {
    0%   { transform: scale(1.3); }
    60%  { transform: scale(0.92); }
    100% { transform: scale(1); }
  }
  .die-shadow {
    width: 52px;
    height: 11px;
    margin-top: 12px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.4);
    filter: blur(2px);
  }
  .die-shadow.spinning {
    animation: shadow-pulse 0.5s linear infinite;
  }
  .die-shadow.settled {
    animation: shadow-land 0.4s ease;
  }
  @keyframes shadow-pulse {
    0%, 100% { transform: scale(1);   opacity: 0.4; }
    50%      { transform: scale(0.65); opacity: 0.22; }
  }
  @keyframes shadow-land {
    0%   { transform: scale(0.55); opacity: 0.15; }
    50%  { transform: scale(1.2);  opacity: 0.45; }
    100% { transform: scale(1);    opacity: 0.4; }
  }
  #story {
    white-space: pre-wrap;
    line-height: 1.55;
    font-size: 16px;
    margin-bottom: 18px;
    min-height: 40px;
  }
  .btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    margin: 6px 0;
    border: 1px solid transparent;
    border-radius: 12px;
    background: var(--btn);
    color: var(--btn-text);
    font-size: 15px;
    cursor: pointer;
    box-shadow: var(--btn-glow, none);
    transition: background-color 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
  }
  .btn:active { opacity: 0.8; }
  .btn:disabled, #sendBtn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  #textRow { display: flex; gap: 8px; margin-top: 14px; }
  #freeText {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--hint);
    background: transparent;
    color: var(--text);
    font-size: 15px;
  }
  #sendBtn {
    padding: 0 16px;
    border: none;
    border-radius: 10px;
    background: var(--btn);
    color: var(--btn-text);
    font-size: 18px;
  }
  #diceBtn {
    background: transparent;
    border: 1px solid var(--hint);
    color: var(--text);
  }

  /* --- Character view --- */
  .section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--hint);
    margin: 18px 0 8px;
    font-family: var(--font-heading);
  }
  .section-title:first-child { margin-top: 0; }
  .hp-bar-track {
    height: 14px;
    border-radius: 8px;
    background: var(--card);
    overflow: hidden;
  }
  .hp-bar-fill {
    height: 100%;
    background: var(--hp);
    transition: width 0.3s ease;
  }
  .hp-label {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .money-line {
    font-size: 15px;
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--card);
  }
  .attr-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .attr-name { width: 40%; color: var(--hint); }
  .attr-bar-track {
    flex: 1;
    height: 10px;
    border-radius: 6px;
    background: var(--card);
    overflow: hidden;
  }
  .attr-bar-fill {
    height: 100%;
    background: var(--attr);
  }
  .attr-value { width: 24px; text-align: right; }
  .inv-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .inv-item {
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--card);
    font-size: 13px;
    line-height: 1.35;
  }
  .empty-note {
    color: var(--hint);
    font-size: 14px;
  }
  .equipped-badge {
    display: inline-block;
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--attr);
    color: #fff;
    margin-left: 6px;
    vertical-align: middle;
  }

  /* --- Journal view --- */
  .journal-subtabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .journal-subtab-btn {
    flex: 1;
    padding: 9px 6px;
    border-radius: 10px;
    border: none;
    background: var(--card);
    color: var(--text);
    font-family: var(--font-heading);
    font-size: 13px;
    opacity: 0.6;
    cursor: pointer;
  }
  .journal-subtab-btn.active { opacity: 1; background: var(--btn); }
  .journal-panel { display: none; }
  .journal-panel.active { display: block; }
  .location-card {
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--card);
    margin-bottom: 14px;
  }
  .location-card .location-name {
    font-family: var(--font-heading);
    font-size: 15px;
    margin-bottom: 4px;
  }
  .location-card .location-desc { font-size: 13px; color: var(--hint); }
  .visited-chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .visited-chip {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--bg);
    color: var(--hint);
  }
  /* --- Schematic location map (graph of visited places, see renderLocationMap) --- */
  .loc-map-hint {
    font-size: 12px;
    color: var(--hint);
    margin-bottom: 8px;
  }
  .loc-map-wrap {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    margin-bottom: 14px;
    border-radius: 12px;
    background: var(--card);
    padding: 6px 0;
  }
  .loc-map-wrap svg { display: block; }
  .loc-map-edge {
    stroke: var(--hint);
    stroke-width: 1.5;
    opacity: 0.55;
  }
  .loc-map-node-circle {
    fill: var(--bg);
    stroke: var(--hint);
    stroke-width: 1.5;
    cursor: pointer;
  }
  .loc-map-node.current .loc-map-node-circle {
    fill: var(--attr);
    stroke: var(--attr);
    opacity: 0.9;
  }
  .loc-map-node.selected .loc-map-node-circle {
    stroke: var(--attr);
    stroke-width: 2.5;
  }
  .loc-map-node-label {
    font-size: 10px;
    fill: var(--text);
    text-anchor: middle;
    pointer-events: none;
  }
  .loc-map-node.current .loc-map-node-label {
    fill: var(--btn-text);
    font-weight: 700;
  }
  .npc-card, .quest-card {
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--card);
    margin-bottom: 10px;
  }
  .npc-name, .quest-title {
    font-family: var(--font-heading);
    font-size: 14px;
  }
  .npc-relationship, .quest-status {
    display: inline-block;
    font-size: 10px;
    padding: 2px 9px;

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
// True fullscreen (Bot API 8.0+ / Telegram 7.7+): drops the native header
// bar entirely. Older clients don't have this method — fail silently and
// fall back to the regular expanded view from tg.expand() above.
try { if (tg.requestFullscreen) tg.requestFullscreen(); } catch (e) {}
// Fullscreen makes an accidental swipe-down easy to trigger right on top of
// the story text — disable the swipe-to-close gesture while in the app.
try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}

// Telegram floats its own controls on top of the page in both modes: a
// "close" (X) pill when not in fullscreen, and a close pill plus a
// minimize/menu pill when fullscreen IS active. contentSafeAreaInset is
// supposed to report that floating row's height, but on a lot of Android
// builds it reports 0 even while the pills are visible — so instead of
// trusting it alone, we always reserve a minimum buffer ourselves and only
// let Telegram's own number stretch it further (e.g. for a notch/punch-hole
// camera on top of that).
const MIN_HEADER_SAFE_TOP = 56;

function applyHeaderSafeTop() {
  document.documentElement.style.setProperty("--header-safe-top", MIN_HEADER_SAFE_TOP + "px");
}
try { tg.onEvent("fullscreenChanged", applyHeaderSafeTop); } catch (e) {}
try { tg.onEvent("fullscreenFailed", applyHeaderSafeTop); } catch (e) {}
applyHeaderSafeTop();

function applyTelegramSafeArea() {
  const inset = tg.contentSafeAreaInset || tg.safeAreaInset || {};
  const extraTop = Math.max((inset.top || 0) - MIN_HEADER_SAFE_TOP, 0);
  document.documentElement.style.setProperty("--tg-extra-top", extraTop + "px");
  document.documentElement.style.setProperty("--tg-extra-bottom", (inset.bottom || 0) + "px");
}
try {
  tg.onEvent("safeAreaChanged", applyTelegramSafeArea);
  tg.onEvent("contentSafeAreaChanged", applyTelegramSafeArea);
} catch (e) {}
applyTelegramSafeArea();

const initData = tg.initData;
const currentUserId = (tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : null;

// A room invite link opens the bot with a "join_<CODE>" deep-link payload;
// the bot embeds that code into the Mini App's own URL as ?room=<CODE> when
// it sends the launch button (see send_miniapp_button in main.py), so we
// just have to read it back here once. Consumed (nulled) the first time
// it's used, so navigating within the app afterward doesn't re-trigger it.
let pendingJoinRoomCode = (new URLSearchParams(window.location.search).get("room") || "").trim().toUpperCase() || null;

// Fetched lazily (once) from /api/config so the invite-share button can
// build a t.me deep link — not needed at all until someone taps "Share".
let botUsername = null;

// --- Multiplayer (turn-based rooms) ---
let roomMode = false;
let roomId = null;
let myTurn = true;
let roomPollTimer = null;
let lastActiveUserId = null;
let currentLanguage = null;

// Localized UI strings for the game screen (tabs, menu, section titles,
// errors) — fetched once via /api/ui as soon as we know the game's
// language, either from /api/state (existing game) or from the wizard's
// chosen language (new game, see startAdventure()).
let gameUi = null;

function t(key, vars) {
  let template = (gameUi && gameUi[key]) || key;
  if (vars) {
    for (const [k, v] of Object.entries(vars)) {
      template = template.split(`{${k}}`).join(v);
    }
  }
  return template;
}

function localizeStaticUI() {
  document.getElementById("tabStoryBtn").textContent = "🗺️ " + t("tab_story");
  document.getElementById("tabCharBtn").textContent = "🧙 " + t("tab_character");
  document.getElementById("tabJournalBtn").innerHTML = "📖 " + escapeHtml(t("tab_journal"));
  document.getElementById("journalQuestsLabel").textContent = t("journal_quests_tab");
  document.getElementById("journalNpcsLabel").textContent = t("journal_npcs_tab");
  document.getElementById("journalLocationsLabel").textContent = t("journal_locations_tab");
  document.getElementById("menuBtn").textContent = "☰ " + t("menu_label");
  document.getElementById("menuTitle").textContent = "⚙️ " + t("menu_label");
  document.getElementById("appearanceTitle").textContent = t("appearance_title");
  document.getElementById("categoryThemeLabel").textContent = t("category_theme_label");
  document.getElementById("logTitle").textContent = "📜 " + t("log_title");
  document.getElementById("healthTitle").textContent = t("health_title");
  document.getElementById("moneyTitle").textContent = t("money_title");
  document.getElementById("attrsTitle").textContent = t("attributes_title");
  document.getElementById("invTitle").textContent = t("inventory_title");
  document.getElementById("diceBtn").textContent = "🎲 " + t("roll_button_label");
  document.getElementById("freeText").placeholder = t("free_text_placeholder");
  document.getElementById("leaveRoomBtn").textContent = t("leave_room_button");
  document.getElementById("multiplayerTitle").textContent = t("multiplayer_menu_title");
  document.getElementById("createRoomMenuBtn").textContent = "➕ " + t("mode_create_room").replace(/^[^\s]+\s*/, "");
  document.getElementById("joinRoomMenuBtn").textContent = "🔑 " + t("mode_join_room").replace(/^[^\s]+\s*/, "");
  document.getElementById("endGameBtn").textContent = "🏁 " + t("end_adventure_button");
}

let lastCharacter = null;
let lastLog = [];
let lastJournal = {};
// Which location-map node is currently tapped open (shows its description
// below the map) — resets to the character's current location by default
// each time the journal re-renders with a different one.
let selectedMapLocation = null;
let diceInterval = null;
let currentThemeIcon = "";
let useCategoryTheme = localStorage.getItem("useCategoryTheme") !== "false"; // default: on

// Neutral dice look used when the person prefers Telegram's own theme
// instead of the per-category one.
const NEUTRAL_DICE = { dice: 0x5b6373, edge: 0x14151a, light: 0xffffff };

// Per-category visual theme: CSS handles colors/fonts/background via
// html[data-theme], this map covers what only JS can touch (the 3D dice
// material/edge/light colors, and a small accent icon on action buttons).
const THEMES = {
  default:   { dice: 0x3a2f5c, edge: 0xc9a4ff, light: 0xd9c2ff, icon: "✨" },
  fantasy:   { dice: 0x5a4326, edge: 0xf0c674, light: 0xffd9a0, icon: "⚔️" },
  scifi:     { dice: 0x123244, edge: 0x29d8ff, light: 0x88ccff, icon: "🛰️" },
  postapo:   { dice: 0x4a3c28, edge: 0xd9a02b, light: 0xffcf7a, icon: "☢️" },
  horror:    { dice: 0x2a0a0a, edge: 0x8a2222, light: 0xff6666, icon: "💀" },
  cyberpunk: { dice: 0x2a0a3a, edge: 0xff2fe0, light: 0x38e8ff, icon: "🤖" },
  steampunk: { dice: 0x4a3216, edge: 0xc9973e, light: 0xffcf7a, icon: "⚙️" },
  detective: { dice: 0x3a352a, edge: 0xc9b26a, light: 0xf2e9d6, icon: "🕵️" },
  western:   { dice: 0x4a2f16, edge: 0xc98a3e, light: 0xffd9a0, icon: "🤠" },
  pirates:   { dice: 0x0e3a30, edge: 0xe0b656, light: 0xfff0c2, icon: "🏴‍☠️" },
};

// No category yet (language/mode picker, lobby, character creation) falls
// back to the "default" entry above instead of a plain, unstyled look —
// matching look and feel is restored as soon as a category IS chosen.
function applyTheme(category) {
  const key = category || "default";
  const theme = useCategoryTheme ? THEMES[key] : null;
  document.documentElement.dataset.theme = theme ? key : "";
  // Drives the uk/ru Cyrillic font-alternate CSS rules (see [data-lang] in
  // the stylesheet) — kept in sync here so every applyTheme() call also
  // re-checks it, not just the moment the language was first picked.
  document.documentElement.dataset.lang = currentLanguage || "";
  currentThemeIcon = theme ? theme.icon : "";
  const diceColors = theme || NEUTRAL_DICE;
  if (dieMesh) {
    dieMesh.material.color.setHex(diceColors.dice);
    if (diceEdgeMaterial) diceEdgeMaterial.color.setHex(diceColors.edge);
    if (diceKeyLight) diceKeyLight.color.setHex(diceColors.light);
  }
}

// --- Real 3D d20 (icosahedron) via three.js ---
let scene, camera, renderer, dieMesh, diceEdgeMaterial, diceKeyLight;
let rotSpeed = { x: 0.002, y: 0.004, z: 0.001 };
let decelInterval = null;

function initDiceScene() {
  const canvas = document.getElementById("diceCanvas");
  const size = 110;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(35, 1, 0.1, 10);
  camera.position.set(0, 0, 4.2);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(size, size, false);

  const geometry = new THREE.IcosahedronGeometry(1.15, 0); // radius, detail=0 -> exactly 20 faces
  const material = new THREE.MeshPhongMaterial({
    color: 0x5b6373,
    flatShading: true,
    shininess: 30,
    specular: 0x333333,
  });
  dieMesh = new THREE.Mesh(geometry, material);
  scene.add(dieMesh);

  const edges = new THREE.EdgesGeometry(geometry);
  diceEdgeMaterial = new THREE.LineBasicMaterial({ color: 0x14151a });
  const edgeLines = new THREE.LineSegments(edges, diceEdgeMaterial);
  dieMesh.add(edgeLines);

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  diceKeyLight = new THREE.DirectionalLight(0xffffff, 0.9);
  diceKeyLight.position.set(2, 3, 4);
  scene.add(diceKeyLight);
  const fill = new THREE.DirectionalLight(0x88aaff, 0.35);
  fill.position.set(-3, -1, -2);
  scene.add(fill);

  renderDiceLoop();
}

function renderDiceLoop() {
  requestAnimationFrame(renderDiceLoop);
  if (!dieMesh) return;
  dieMesh.rotation.x += rotSpeed.x;
  dieMesh.rotation.y += rotSpeed.y;
  dieMesh.rotation.z += rotSpeed.z;
  renderer.render(scene, camera);
}

function startDiceAnimation(sides) {
  const wrap = document.getElementById("diceAnim");
  const face = document.getElementById("dieFace");
  const shadow = document.getElementById("dieShadow");
  const number = document.getElementById("dieNumber");
  clearInterval(decelInterval);
  wrap.style.display = "flex";
  face.classList.remove("settled");
  shadow.classList.remove("settled");
  shadow.classList.add("spinning");
  rotSpeed = { x: 0.18, y: 0.24, z: 0.1 };
  number.textContent = "?";
  diceInterval = setInterval(() => {
    number.textContent = String(1 + Math.floor(Math.random() * sides));
  }, 70);
}

function stopDiceAnimation(finalValue) {
  return new Promise(resolve => {
    clearInterval(diceInterval);
    const wrap = document.getElementById("diceAnim");
    const face = document.getElementById("dieFace");
    const shadow = document.getElementById("dieShadow");
    const number = document.getElementById("dieNumber");

    number.textContent = String(finalValue ?? "?");
    shadow.classList.remove("spinning");
    shadow.classList.add("settled");
    face.classList.add("settled");

    // Ease the spin down to a slow idle instead of stopping abruptly.
    decelInterval = setInterval(() => {
      rotSpeed.x *= 0.85;
      rotSpeed.y *= 0.85;
      rotSpeed.z *= 0.85;
      if (Math.abs(rotSpeed.y) < 0.004) {
        clearInterval(decelInterval);
        rotSpeed = { x: 0.002, y: 0.004, z: 0.001 };
      }
    }, 40);

    setTimeout(() => {
      wrap.style.display = "none";
      face.classList.remove("settled");
      shadow.classList.remove("settled");
      resolve();
    }, 650);
  });
}

function switchTab(name) {
  document.getElementById("storyView").classList.toggle("active", name === "story");
  document.getElementById("characterView").classList.toggle("active", name === "character");
  document.getElementById("journalView").classList.toggle("active", name === "journal");
  document.getElementById("tabStoryBtn").classList.toggle("active", name === "story");
  document.getElementById("tabCharBtn").classList.toggle("active", name === "character");
  document.getElementById("tabJournalBtn").classList.toggle("active", name === "journal");
  if (name === "character") renderCharacterView();
  if (name === "journal") renderJournal();
}

let journalSubtab = "quests";

function switchJournalSubtab(name) {
  journalSubtab = name;
  document.getElementById("journalPanelQuests").classList.toggle("active", name === "quests");
  document.getElementById("journalPanelNpcs").classList.toggle("active", name === "npcs");
  document.getElementById("journalPanelLocations").classList.toggle("active", name === "locations");
  document.getElementById("journalSubtabQuests").classList.toggle("active", name === "quests");
  document.getElementById("journalSubtabNpcs").classList.toggle("active", name === "npcs");
  document.getElementById("journalSubtabLocations").classList.toggle("active", name === "locations");
}

function renderJournal() {
  const j = lastJournal || {};

  // Quests
  const quests = j.quests || [];
  const questsEl = document.getElementById("journalPanelQuests");
  if (!quests.length) {
    questsEl.innerHTML = `<div class="empty-note">${t("no_quests_note")}</div>`;
  } else {
    const statusLabel = s => t("quest_status_" + s) || s;
    questsEl.innerHTML = quests.map(q => `
      <div class="quest-card">
        <span class="quest-title">${escapeHtml(q.title || "")}</span>
        <span class="quest-status ${escapeHtml(q.status || "active")}">${escapeHtml(statusLabel(q.status || "active"))}</span>
        ${q.description ? `<div class="quest-desc">${escapeHtml(q.description)}</div>` : ""}
      </div>
    `).join("");
  }

  // NPCs
  const npcs = j.npcs || [];
  const npcsEl = document.getElementById("journalPanelNpcs");
  if (!npcs.length) {
    npcsEl.innerHTML = `<div class="empty-note">${t("no_npcs_note")}</div>`;
  } else {
    npcsEl.innerHTML = npcs.map(n => `
      <div class="npc-card">
        <span class="npc-name">${escapeHtml(n.name || "")}</span>
        ${n.relationship ? `<span class="npc-relationship">${escapeHtml(n.relationship)}</span>` : ""}
        ${n.description ? `<div class="npc-desc">${escapeHtml(n.description)}</div>` : ""}
      </div>
    `).join("");
  }

  renderLocationsPanel(j);
}

// --- Schematic location map -------------------------------------------
//
// Draws every visited location as a node, connected to the already-known
// place it was reached from (location_graph's "connected_from", see
// core.py's apply_journal_update / gemini_client.py's UPDATE_JOURNAL_FUNCTION).
// This is deliberately NOT a geographic/illustrated map — Gemini can't keep
// cardinal directions or a consistent art style across many separate turns —
// just a simple node-and-line diagram of how places connect, like a
// quest-log map in a text adventure.

function renderLocationsPanel(j) {
  const locationsEl = document.getElementById("journalPanelLocations");
  const graph = j.location_graph || [];
  const visited = j.visited_locations || [];
  if (!j.location && !visited.length) {
    locationsEl.innerHTML = `<div class="empty-note">${t("no_locations_note")}</div>`;
    return;
  }
  const currentName = j.location ? j.location.name : null;
  // Default the open detail card to wherever the party currently is, the
  // first time there's something to show.
  if (selectedMapLocation == null && currentName) selectedMapLocation = currentName;

  let html = "";
  if (graph.length) {
    html += `<div class="loc-map-hint">${escapeHtml(t("tap_location_hint"))}</div>`;
    html += renderLocationMapSvg(graph, currentName);
  }

  // Detail card for whichever node is selected (falls back to the current
  // location's own card if nothing in location_graph matched, e.g. very old
  // save data from before location_graph existed).
  const selected = graph.find(n => n.name === selectedMapLocation);
  if (selected) {
    html += `
      <div class="location-card">
        <div class="location-name">${selected.name === currentName ? "📍 " : ""}${escapeHtml(selected.name)}</div>
        ${selected.description ? `<div class="location-desc">${escapeHtml(selected.description)}</div>` : ""}
      </div>
    `;
  } else if (j.location) {
    html += `
      <div class="location-card">
        <div class="location-name">📍 ${escapeHtml(j.location.name || "")}</div>
        ${j.location.description ? `<div class="location-desc">${escapeHtml(j.location.description)}</div>` : ""}
      </div>
    `;
  }
  locationsEl.innerHTML = html;
}

function selectMapLocation(name) {
  selectedMapLocation = name;
  renderJournal();
}

// Lays out location_graph (a flat list of {name, description, connected_from})
// as a simple top-down tree: each node's parent is the location it was
// connected_from; nodes with no known/matching parent become their own
// root. Leaves get sequential x slots left-to-right; a parent is centered
// over the average x of its children. Returns {nodes, maxX, maxDepth}
// with each node annotated with .x/.depth, or null if nothing to draw.
function layoutLocationGraph(graph) {
  if (!graph.length) return null;
  const byName = {};
  graph.forEach(n => { byName[n.name] = { ...n, children: [] }; });
  const roots = [];
  Object.values(byName).forEach(n => {
    const parent = n.connected_from && byName[n.connected_from] && byName[n.connected_from] !== n
      ? byName[n.connected_from] : null;
    if (parent) parent.children.push(n);
    else roots.push(n);
  });
  let xCounter = 0;
  const place = (n, depth, seen) => {
    // seen guards against a malformed cycle (shouldn't happen given how
    // connected_from is written, but never trust model output blindly).
    if (seen.has(n.name)) { n.depth = depth; n.x = xCounter++; return; }
    seen.add(n.name);
    n.depth = depth;
    if (!n.children.length) {
      n.x = xCounter++;
    } else {
      n.children.forEach(c => place(c, depth + 1, seen));
      n.x = n.children.reduce((sum, c) => sum + c.x, 0) / n.children.length;
    }
  };
  roots.forEach(r => place(r, 0, new Set()));
  const nodes = Object.values(byName);
  const maxX = Math.max(...nodes.map(n => n.x));
  const maxDepth = Math.max(...nodes.map(n => n.depth));
  return { nodes, maxX, maxDepth };
}

function renderLocationMapSvg(graph, currentName) {
  const layout = layoutLocationGraph(graph);
  if (!layout) return "";
  const xSpacing = 86, ySpacing = 64, pad = 40, r = 22;
  const width = (layout.maxX + 1) * xSpacing + pad;
  const height = (layout.maxDepth + 1) * ySpacing + pad;
  const cx = n => pad / 2 + n.x * xSpacing + xSpacing / 2;
  const cy = n => pad / 2 + n.depth * ySpacing + ySpacing / 2;

  let edges = "";
  layout.nodes.forEach(n => {
    if (n.connected_from) {
      const parent = layout.nodes.find(p => p.name === n.connected_from);
      if (parent) {
        edges += `<line class="loc-map-edge" x1="${cx(parent)}" y1="${cy(parent)}" x2="${cx(n)}" y2="${cy(n)}" />`;
      }
    }
  });

  let nodesHtml = "";
  layout.nodes.forEach(n => {
    const isCurrent = n.name === currentName;
    const isSelected = n.name === selectedMapLocation;
    const label = n.name.length > 14 ? n.name.slice(0, 13) + "…" : n.name;
    const cls = ["loc-map-node", isCurrent ? "current" : "", isSelected ? "selected" : ""].filter(Boolean).join(" ");
    // JSON.stringify safely escapes quotes/backslashes for the JS call
    // itself; the attribute is then single-quoted and "&" escaped so an
    // unusual location name (quotes, "&", etc. — this is free text Gemini
    // wrote) can never break out of the onclick attribute.
    const jsArg = JSON.stringify(n.name).replace(/&/g, "&amp;");
    nodesHtml += `
      <g class="${cls}" onclick='selectMapLocation(${jsArg})'>
        <circle class="loc-map-node-circle" cx="${cx(n)}" cy="${cy(n)}" r="${r}"></circle>
        <text class="loc-map-node-label" x="${cx(n)}" y="${cy(n) + r + 12}">${escapeHtml(label)}</text>
      </g>
    `;
  });

  return `
    <div class="loc-map-wrap">
      <svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
        ${edges}
        ${nodesHtml}
      </svg>
    </div>
  `;
}

// Ends the current solo adventure (deletes its save) and returns to the
// very first screen. Uses Telegram's own confirm dialog when available so
// it looks native instead of a plain browser confirm() popup.
function confirmEndAdventure() {
  const msg = t("end_adventure_confirm");
  if (tg.showConfirm) {
    tg.showConfirm(msg, (confirmed) => { if (confirmed) endAdventure(); });
  } else if (window.confirm(msg)) {

// A short closing passage shown full-screen instead of the normal story
// view — used both when a character is defeated and when the player ends
// an adventure early from the menu. Reuses the onboarding view's styling

function showEpilogueScreen(epilogueText) {

function renderParty(party, activeUserId) {
  const el = document.getElementById("partyPanel");
  if (!roomMode || !party || !party.length) {
    el.style.display = "none";
    return;
  }
  el.style.display = "block";
  const rows = party.map(p => {
    const mark = p.user_id === activeUserId ? "👉 " : "";
    const hp = (p.hp != null && p.max_hp != null) ? ` ❤️${p.hp}/${p.max_hp}` : "";
    // character_name is the in-fiction name Gemini gave this character at
    // creation — shown next to the player's own login so the party list
    // reads like a cast list, not just a list of Telegram accounts. Older
    // characters created before this existed have no character_name, so
    // this falls back to just the login alone.
    const charName = p.character_name ? ` (${escapeHtml(p.character_name)})` : "";
    return `<div>${mark}${escapeHtml(p.display_name)}${charName}${hp}</div>`;
  }).join("");
  const codeLine = roomId
    ? `<div style="margin-top:6px;color:var(--hint);font-size:13px;">${t("room_code_label")}: <b>${escapeHtml(roomId)}</b></div>`
    : "";
  el.innerHTML = `<div class="preview-card">${rows}${codeLine}</div>`;
}

function renderLobby(data) {

// Opens Telegram's native "share to chat" sheet with a deep link that drops
// the recipient straight into joining this room — they don't need to be
// told or type the room code themselves. Falls back to copying the link if
// the bot's username couldn't be resolved (e.g. PUBLIC_URL not configured)
// or the native share sheet isn't available (outside Telegram).
async function shareRoomInvite() {
  if (!roomId) return;
  if (!botUsername) {
    try {
      const cfg = await fetch("/api/config").then(r => r.json());
      botUsername = cfg.bot_username || null;
    } catch (e) {}
  }
  if (!botUsername) {
    try { await navigator.clipboard.writeText(roomId); } catch (e) {}
    alert(t("share_invite_fallback").replace("{code}", roomId));
    return;
  }
  const deepLink = `https://t.me/${botUsername}?start=join_${roomId}`;
  const text = t("share_invite_text");
  const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(deepLink)}&text=${encodeURIComponent(text)}`;
  if (tg.openTelegramLink) {
    tg.openTelegramLink(shareUrl);
  } else {
    window.open(shareUrl, "_blank");
  }
}

let _startingRoomAdventure = false;

async function startRoomAdventure() {
  // Guards against a double-tap (or a slow-connection retry) firing this
  // twice — the backend now also serializes /api/room/start per room, but
  // skipping the duplicate request here avoids a pointless second Gemini
  // call and a flash of "already_started" in the UI.
  if (_startingRoomAdventure) return;
  _startingRoomAdventure = true;
  onboardingHTML(`<div class="wiz-loading">${escapeHtml(t("creating"))}</div>`);
  try {
    const data = await api("/api/room/start", {});
    await _handleRoomStartResult(data);
  } finally {
    _startingRoomAdventure = false;
  }
}

async function _handleRoomStartResult(data) {
  if (data.error) {
    const message = data.error === "content_blocked"
      ? t("content_blocked")
      : t("error_prefix") + (data.detail || data.error);
    onboardingHTML(
      `<div class="wiz-loading">${escapeHtml(message)}</div>` +
      `<button class="btn" onclick="loadState()">${escapeHtml(t("retry_button"))}</button>`
    );
    return;
  }
  document.getElementById("onboardingView").classList.remove("active");
  document.getElementById("storyView").classList.add("active");
  showTabs(true);
  lastActiveUserId = data.active_user_id;
  await applyState(data);
}

function startRoomPolling() {
  stopRoomPolling();
  roomPollTimer = setInterval(async () => {
    if (!roomMode) return;
    const data = await api("/api/room/state", {});
    if (data.error) return;

    const inLobbyView = document.getElementById("onboardingView").classList.contains("active");

    if (!data.started) {
      // Still in the lobby — refresh the seat list so a host sees new
      // joiners show up, and anyone sees the host's display stay current.
      if (inLobbyView) renderLobby(data);
      return;
    }

    // The host just pressed "start" (or this is an ongoing game) — if we
    // were showing the lobby, switch over to the story view now.
    const justStarted = inLobbyView;
    const changed = justStarted || (data.log && data.log.length !== lastLog.length) || data.active_user_id !== lastActiveUserId;
    lastActiveUserId = data.active_user_id;
    if (changed) {
      if (justStarted) {
        document.getElementById("onboardingView").classList.remove("active");
        document.getElementById("storyView").classList.add("active");
        showTabs(true);
      }
      await applyState(data);
    } else {
      renderParty(data.party, data.active_user_id);
    }
  }, 4000);
}

function stopRoomPolling() {
  if (roomPollTimer) clearInterval(roomPollTimer);
  roomPollTimer = null;
}

// Mirrors dice.py / core.py's modifier formulas, so the button preview
// always matches what the server will actually apply when rolled.
function hpPenalty(hp, maxHp) {
  if (!maxHp || maxHp <= 0) return 0;
  const ratio = hp / maxHp;
  if (ratio <= 0.2) return -2;
  if (ratio <= 0.45) return -1;
  return 0;
}

function attributeModifier(value) {
  const v = parseFloat(value);
  if (isNaN(v)) return 0;
  if (v <= 2) return -2;
  if (v <= 4) return -1;
  if (v <= 6) return 0;
  if (v <= 8) return 1;
  return 2;
}

function computeModifier(character, attribute) {
  const hp = character?.hp ?? 30;
  const maxHp = character?.max_hp ?? 30;
  let modifier = hpPenalty(hp, maxHp);
  if (attribute && character?.attributes && character.attributes[attribute] !== undefined) {
    modifier += attributeModifier(character.attributes[attribute]);
  }
  return modifier;
}

function renderOptions(options) {
  const el = document.getElementById("options");
  el.innerHTML = "";
  (options || []).forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "btn";
    const prefix = currentThemeIcon ? currentThemeIcon + " " : "";
    let label = prefix + (i + 1) + ") " + opt.text;
    if (opt.requires_roll) {
      const modifier = computeModifier(lastCharacter, opt.attribute);
      label += modifier ? ` 🎲${modifier > 0 ? "+" : ""}${modifier}` : " 🎲";
    }
    btn.textContent = label;
    btn.onclick = () => sendChoice(i + 1, opt.requires_roll);
    el.appendChild(btn);
  });
}

function tierLabel(tier) {
  const emoji = {
    critical_failure: "💥", failure: "❌", partial_success: "➖",
    success: "✅", critical_success: "🌟",
  }[tier] || "";
  return `${emoji} ${t("tier_" + tier)}`.trim();
}

function renderRoll(roll) {
  const el = document.getElementById("rollResult");
  if (!roll) { el.innerHTML = ""; return; }
  const modifierText = roll.modifier ? ` (${roll.modifier > 0 ? "+" : ""}${roll.modifier})` : "";
  const rollLine = t("dice_roll_label", { sides: roll.sides }) + `: ${roll.value}${modifierText}`;
  const totalLine = t("dice_total", { total: roll.total });
  el.innerHTML = `<div class="roll-card">${rollLine}<br>${totalLine}<br>${tierLabel(roll.tier)}</div>`;
}

function renderChanges(changes) {
  const el = document.getElementById("changesResult");
  if (!changes) { el.innerHTML = ""; return; }
  const parts = [];
  if (changes.hp_delta) {
    const cls = changes.hp_delta > 0 ? "positive" : "negative";
    parts.push(`<span class="delta ${cls}">❤️ ${changes.hp_delta > 0 ? "+" : ""}${changes.hp_delta}</span>`);
  }
  if (changes.money_delta) {
    const cls = changes.money_delta > 0 ? "positive" : "negative";
    parts.push(`<span class="delta ${cls}">💰 ${changes.money_delta > 0 ? "+" : ""}${changes.money_delta}</span>`);
  } else if (changes.money_note) {
    parts.push(`<span class="delta">💰 ${escapeHtml(changes.money_note)}</span>`);
  }
  (changes.inventory_added || []).forEach(item =>
    parts.push(`<span class="delta positive">🎒 +${escapeHtml(item)}</span>`));
  (changes.inventory_removed || []).forEach(item =>
    parts.push(`<span class="delta negative">🎒 -${escapeHtml(item)}</span>`));
  el.innerHTML = parts.length ? `<div class="changes-row">${parts.join("")}</div>` : "";
}

function renderCharacterView() {
  const c = lastCharacter || {};

  // HP bar
  const hp = c.hp ?? 0;
  const maxHp = c.max_hp ?? 0;
  const pct = maxHp > 0 ? Math.max(0, Math.min(100, (hp / maxHp) * 100)) : 0;
  document.getElementById("charHp").innerHTML = `
    <div class="hp-label"><span>${hp} / ${maxHp}</span></div>
    <div class="hp-bar-track"><div class="hp-bar-fill" style="width:${pct}%"></div></div>
  `;

  // Money
  document.getElementById("charMoney").innerHTML = c.money
    ? `<div class="money-line">💰 ${c.money}</div>`
    : `<div class="empty-note">${t("unknown_value")}</div>`;

  // Attributes
  const attrs = c.attributes || {};
  const attrKeys = Object.keys(attrs);
  const attrsEl = document.getElementById("charAttrs");
  if (!attrKeys.length) {
    attrsEl.innerHTML = `<div class="empty-note">${t("no_data_note")}</div>`;
  } else {
    attrsEl.innerHTML = attrKeys.map(key => {
      const raw = attrs[key];
      const value = typeof raw === "number" ? raw : parseFloat(raw) || 0;
      const barPct = Math.max(0, Math.min(100, (value / 10) * 100));
      return `
        <div class="attr-row">
          <div class="attr-name">${key}</div>
          <div class="attr-bar-track"><div class="attr-bar-fill" style="width:${barPct}%"></div></div>
          <div class="attr-value">${raw}</div>
        </div>
      `;
    }).join("");
  }

  // Inventory — items are {name, equipped} objects; a plain string also
  // tolerated defensively in case an older save slipped through unnormalized.
  const items = c.inventory || [];
  const invEl = document.getElementById("charInventory");
  if (!items.length) {
    invEl.innerHTML = `<div class="empty-note">${t("empty_note_generic")}</div>`;
  } else {
    invEl.innerHTML = `<div class="inv-grid">` +
      items.map(item => {
        const name = typeof item === "string" ? item : (item.name || "");
        const equipped = typeof item === "object" && item && item.equipped;
        const badge = equipped ? `<span class="equipped-badge">${escapeHtml(t("equipped_label"))}</span>` : "";
        return `<div class="inv-item">🎒 ${escapeHtml(name)}${badge}</div>`;
      }).join("") +
      `</div>`;
  }
}

function renderMenuLog() {
  const el = document.getElementById("menuLogList");
  if (!lastLog.length) {
    el.innerHTML = `<div class="empty-note">${t("empty_log_note")}</div>`;
    return;
  }
  el.innerHTML = lastLog.map(entry => {
    const isPlayer = entry.startsWith("[Player]:") || entry.startsWith("[Гравець]:");
    const text = entry.replace(/^\[(Player|Гравець|DM)\]:\s*/, "");
    return `<div class="log-entry ${isPlayer ? "player" : "dm"}">${escapeHtml(text)}</div>`;
  }).join("");
  el.scrollTop = el.scrollHeight;
}

async function applyState(data) {
  lastCharacter = data.character || null;
  if (data.log) lastLog = data.log;
  if (data.journal) lastJournal = data.journal;
  if (data.room_id) roomId = data.room_id;
  if (data.language) currentLanguage = data.language;
  if (data.language && !gameUi) {
    gameUi = await fetch(`/api/ui?lang=${data.language}`).then(r => r.json());
    localizeStaticUI();
  }
  applyTheme(lastCharacter && lastCharacter.category);
  renderStatus(data.character);
  renderStory(data.text);
  renderParty(data.party, data.active_user_id);
  lastActiveUserId = data.active_user_id;

  const canAct = !roomMode || data.active_user_id == null || data.active_user_id === currentUserId;
  setActionControlsEnabled(canAct);
  if (canAct) renderOptions(data.options);

  if (document.getElementById("characterView").classList.contains("active")) {
    renderCharacterView();
  }
  if (document.getElementById("journalView").classList.contains("active")) {
    renderJournal();
  }
  if (document.getElementById("sideMenu").classList.contains("open")) {
    renderMenuLog();
  }
}

function setBusy(busy) {
  document.getElementById("diceBtn").disabled = busy;
  document.getElementById("sendBtn").disabled = busy;
}

function setLoading() {
  renderRoll(null);
  renderChanges(null);
  document.getElementById("options").innerHTML = "";
  renderStory("...");
}

async function loadState() {
  const roomData = await api("/api/room/state", {});
  if (!roomData.error) {
    roomMode = true;
    if (roomData.language) currentLanguage = roomData.language;
    if (roomData.language && !gameUi) {
      gameUi = await fetch(`/api/ui?lang=${roomData.language}`).then(r => r.json());
      localizeStaticUI();
    }
    if (!roomData.started) {
      renderLobby(roomData);
      startRoomPolling();
      return;
    }
    showTabs(true);
    document.getElementById("onboardingView").classList.remove("active");
    document.getElementById("storyView").classList.add("active");
    lastActiveUserId = roomData.active_user_id;
    await applyState(roomData);
    startRoomPolling();
    return;
  }
  if (roomData.error === "unauthorized") {
    showTabs(false);
    document.getElementById("onboardingView").classList.add("active");
    document.getElementById("onboardingView").innerHTML =
      `<div class="wiz-loading">${t("unauthorized_note")}</div>`;
    return;
  }

  const data = await api("/api/state", {});
  if (data.error === "no_active_game") {
    startOnboarding();
    return;
  }
  if (data.error) {
    showTabs(false);
    document.getElementById("onboardingView").classList.add("active");
    document.getElementById("onboardingView").innerHTML =
      `<div class="wiz-loading">${t("unauthorized_note")}</div>`;
    return;
  }
  roomMode = false;
  showTabs(true);
  document.getElementById("onboardingView").classList.remove("active");
  document.getElementById("storyView").classList.add("active");
  await applyState(data);
}

function handleActionResult(data) {
  if (data.error) {
    if (data.error === "not_your_turn") {
      // Someone else's turn started (or finished) while we were mid-action —
      // just resync from the server instead of showing a scary error.
      renderRoll(null);
      lastActiveUserId = data.active_user_id;
      renderParty(data.party, data.active_user_id);
      setActionControlsEnabled(data.active_user_id === currentUserId);
      return;
    }
    const message = data.error === "content_blocked"
      ? t("content_blocked")
      : t("error_prefix") + (data.detail || data.error);
    renderStory(message);
    renderRoll(null);
    // The failed turn was never saved server-side, so the options/character
    // sent back here are still the previous valid ones — restore the
    // buttons instead of leaving the player with no way to proceed.
    if (data.character) {
      lastCharacter = data.character;
      renderStatus(data.character);
      applyTheme(lastCharacter && lastCharacter.category);
    }
    if (data.party) renderParty(data.party, data.active_user_id);
    if (data.options) renderOptions(data.options);
    return;
  }
  renderRoll(data.roll);
  renderChanges(data.changes);
  if (data.defeated) {
    // The server has already deleted this save and generated a short
    // closing passage — show the final narration plus that closing passage
    // instead of the normal story view, with no action buttons (there's
    // nothing left to act on).
    const full = [data.text, data.epilogue].filter(Boolean).join("\n\n");
    showEpilogueScreen(full);
    return;
  }
  applyState(data);
}

async function sendChoice(index, requiresRoll) {
  if (roomMode && !myTurn) return;
  setBusy(true);
  try {
    if (requiresRoll) startDiceAnimation(20);
    setLoading();
    const data = await api(actionPath(), { type: "choice", index });
    if (requiresRoll) await stopDiceAnimation(data.roll ? data.roll.value : null);
    handleActionResult(data);
  } finally {
    setBusy(false);
  }
}

async function sendManualRoll() {
  if (roomMode && !myTurn) return;
  setBusy(true);
  try {
    startDiceAnimation(20);
    setLoading();
    const data = await api(actionPath(), { type: "roll", sides: 20 });
    await stopDiceAnimation(data.roll ? data.roll.value : null);
    handleActionResult(data);
  } finally {
    setBusy(false);
  }
}

async function sendFreeText() {
  if (roomMode && !myTurn) return;
  const input = document.getElementById("freeText");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  setBusy(true);
  try {
    setLoading();
    const data = await api(actionPath(), { type: "text", text });
    handleActionResult(data);
  } finally {
    setBusy(false);
  }
}

// ---------------------------------------------------------------------------
// Onboarding wizard: language -> category -> world -> character -> start
// ---------------------------------------------------------------------------

let wizard = {
  language: null,
  uiStrings: null,
  category: null,
  worldDescription: null,
  characterDescription: null,
  gender: null,
  age: null,
  currentPreview: null,
  multiplayer: null, // null = solo, "host" = creating a room, "join" = joining one
  roomId: null,
};

function onboardingHTML(html) {
  document.getElementById("onboardingView").innerHTML = html;
}

function showWizardError(data) {
  const w = wizard.uiStrings || {};
  const template = w.gemini_error || "Error: {error}";
  const msg = template.replace("{error}", data.detail || data.error || "unknown");
  const retryLabel = w.retry_button || "🔄 Retry";
  onboardingHTML(
    `<div class="wiz-loading">${escapeHtml(msg)}</div>` +
    `<button class="btn" onclick="startOnboarding()">${escapeHtml(retryLabel)}</button>`
  );
}

function startOnboarding() {
  cameFromActiveGame = false;
  selectedMapLocation = null;
  wizard = {
    language: null, uiStrings: null, category: null, worldDescription: null,
    characterDescription: null, gender: null, age: null, currentPreview: null,
    multiplayer: null, roomId: null,
  };
  applyTheme(null);
  showTabs(false);
  closeMenu();
  document.getElementById("partyPanel").style.display = "none";
  document.getElementById("storyView").classList.remove("active");
  document.getElementById("characterView").classList.remove("active");
  document.getElementById("journalView").classList.remove("active");
  document.getElementById("onboardingView").classList.add("active");
  renderLanguageStep();
}

function renderLanguageStep() {
  onboardingHTML(`
    <div class="wiz-title">🌐 Choose language / Обери мову / Выбери язык / Wybierz język</div>
    <div id="langButtons"></div>
  `);
  fetch("/api/languages").then(r => r.json()).then(languages => {
    document.getElementById("langButtons").innerHTML = languages
      .map(l => `<button class="btn" onclick="selectLanguage('${l.key}')">${l.label}</button>`)
      .join("");
  });
}

async function selectLanguage(key) {
  wizard.language = key;
  // Set as soon as the player picks a language (not just once the game
  // state loads later) so the uk/ru Cyrillic font alternates already apply
  // to the rest of the onboarding wizard itself.
  currentLanguage = key;
  document.documentElement.dataset.lang = key;
  onboardingHTML(`<div class="wiz-loading">...</div>`);
  wizard.uiStrings = await fetch(`/api/ui?lang=${key}`).then(r => r.json());
  if (pendingJoinRoomCode) {
    wizard.multiplayer = "join";
    wizard.roomId = pendingJoinRoomCode;
    pendingJoinRoomCode = null;
    renderCharacterMethodStep();
    return;
  }
  renderModeStep();
}

function renderModeStep() {
  const t = wizard.uiStrings;
  onboardingHTML(`
    <div class="wiz-title">${escapeHtml(t.mode_prompt)}</div>
    <button class="btn" onclick="chooseSoloMode()">${escapeHtml(t.mode_solo)}</button>
    <button class="btn" onclick="chooseCreateRoomMode()">${escapeHtml(t.mode_create_room)}</button>
    <button class="btn secondary" onclick="renderJoinRoomStep()">${escapeHtml(t.mode_join_room)}</button>
  `);
}

async function chooseSoloMode() {
  wizard.multiplayer = null;
  const categories = await fetch(`/api/categories?lang=${wizard.language}`).then(r => r.json());
  renderCategoryStep(categories);
}

async function chooseCreateRoomMode() {
  wizard.multiplayer = "host";
  const categories = await fetch(`/api/categories?lang=${wizard.language}`).then(r => r.json());
  renderCategoryStep(categories);
}

function renderJoinRoomStep() {
  const t = wizard.uiStrings;
  onboardingHTML(`
    <div class="wiz-title">${escapeHtml(t.room_code_prompt)}</div>
    <input class="wiz-input" id="roomCodeInput" placeholder="${escapeHtml(t.room_code_placeholder)}" style="text-transform:uppercase">
    <button class="btn" onclick="submitRoomCode()">${escapeHtml(t.continue_button)}</button>
    ${cancelButtonHtml()}
  `);
}

function submitRoomCode() {
  const code = document.getElementById("roomCodeInput").value.trim().toUpperCase();
  if (!code) return;
  wizard.multiplayer = "join";
  wizard.roomId = code;
  renderCharacterMethodStep();
}

function renderCategoryStep(categories) {
  const t = wizard.uiStrings;
  onboardingHTML(`
    <div class="wiz-title">${escapeHtml(t.choose_category)}</div>
    <div id="catButtons"></div>
    ${cancelButtonHtml()}
  `);
  document.getElementById("catButtons").innerHTML = categories
    .map(c => `<button class="btn" onclick="selectCategory('${c.key}')">${escapeHtml(c.label)}</button>`)
    .join("");
}

function selectCategory(key) {
  wizard.category = key;
  renderWorldStep();
}

function renderWorldStep() {
  const t = wizard.uiStrings;
  onboardingHTML(`
    <div class="wiz-title">${escapeHtml(t.describe_world)}</div>
    <textarea class="wiz-textarea" id="worldInput"></textarea>
    <button class="btn" onclick="submitWorldText()">${escapeHtml(t.continue_button)}</button>
    <button class="btn secondary" onclick="requestWorldPreview()">${escapeHtml(t.world_random_button)}</button>
    ${cancelButtonHtml()}
  `);
}

function submitWorldText() {
  const text = document.getElementById("worldInput").value.trim();
  wizard.worldDescription = text || null;
  renderCharacterMethodStep();
}

async function requestWorldPreview() {
  const t = wizard.uiStrings;
  onboardingHTML(`<div class="wiz-loading">${escapeHtml(t.generating_preview)}</div>`);
  const data = await api("/api/preview/world", { language: wizard.language, category: wizard.category });
  if (data.error) { showWizardError(data); return; }
  wizard.currentPreview = data.preview;
  onboardingHTML(`
    <div class="wiz-title">${escapeHtml(t.describe_world)}</div>
    <div class="preview-card">${escapeHtml(data.preview)}</div>
    <button class="btn secondary" onclick="requestWorldPreview()">${escapeHtml(t.preview_regen_button)}</button>
    <button class="btn" onclick="acceptWorldPreview()">${escapeHtml(t.preview_accept_button)}</button>
  `);
}

function acceptWorldPreview() {
  wizard.worldDescription = wizard.currentPreview;
  renderCharacterMethodStep();
}

// One combined screen: type a description yourself, generate one
// automatically (editable afterward, regenerate as many times as you like),
// or mix both — nothing here commits until "Continue" is pressed, so
// changing your mind about the character never means restarting the whole
// onboarding wizard (picking language/mode/category/world again). Replaces
// what used to be four separate steps (method choice → manual text OR
// gender → age → preview-with-confirm).
function renderCharacterMethodStep() {
  const t = wizard.uiStrings;
  wizard.gender = wizard.gender || "any";
  wizard.age = wizard.age || "";
  onboardingHTML(`
    <div class="wiz-title">${escapeHtml(t.describe_character_prompt)}</div>
    <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
      <select class="wiz-input" id="charGenderSelect" style="flex:1;min-width:110px;margin-bottom:0;">
        <option value="any"${wizard.gender === "any" ? " selected" : ""}>${escapeHtml(t.gender_any)}</option>
        <option value="male"${wizard.gender === "male" ? " selected" : ""}>${escapeHtml(t.gender_male)}</option>
        <option value="female"${wizard.gender === "female" ? " selected" : ""}>${escapeHtml(t.gender_female)}</option>
      </select>
      <input class="wiz-input" id="charAgeInput" placeholder="27" value="${escapeHtml(wizard.age)}" style="flex:1;min-width:80px;margin-bottom:0;">
    </div>
    <button class="btn secondary" onclick="generateCharacterDescription()">${escapeHtml(t.character_random_button)}</button>
    <button class="btn" onclick="confirmCharacterStep()">${escapeHtml(t.continue_button)}</button>
    <textarea class="wiz-textarea char-desc" id="charInput" style="margin-top:10px;">${escapeHtml(wizard.characterDescription || "")}</textarea>
    ${cancelButtonHtml()}
  `);
}

async function generateCharacterDescription() {
  const t = wizard.uiStrings;
  wizard.gender = document.getElementById("charGenderSelect").value;
  wizard.age = document.getElementById("charAgeInput").value.trim();
  onboardingHTML(`<div class="wiz-loading">${escapeHtml(t.generating_preview)}</div>`);
  const data = await api("/api/preview/character", {
    language: wizard.language,
    category: wizard.category,
    gender: wizard.gender || "any",
    age: wizard.age || "any",
    world_description: wizard.worldDescription,
  });
  if (data.error) { showWizardError(data); return; }
  // Goes straight back into the same editable textarea rather than a
  // separate read-only preview card — the player can tweak the generated
  // text, regenerate again, or just press Continue, all without leaving
  // this screen.
  wizard.characterDescription = data.preview;
  renderCharacterMethodStep();
}

function confirmCharacterStep() {
  wizard.gender = document.getElementById("charGenderSelect").value;
  wizard.age = document.getElementById("charAgeInput").value.trim() || "any";
  const text = document.getElementById("charInput").value.trim();
  wizard.characterDescription = text || null;
  startAdventure();
}

async function startAdventure() {
  const t = wizard.uiStrings;
  onboardingHTML(`<div class="wiz-loading">${escapeHtml(t.creating)}</div>`);

  let data;
  if (wizard.multiplayer === "host") {
    data = await api("/api/room/create", {
      language: wizard.language,
      category: wizard.category,
      world_description: wizard.worldDescription,
      character_description: wizard.characterDescription,
      gender: wizard.gender,
      age: wizard.age,
    });
  } else if (wizard.multiplayer === "join") {
    data = await api("/api/room/join", {
      room_id: wizard.roomId,
      character_description: wizard.characterDescription,
      gender: wizard.gender,
      age: wizard.age,
    });
  } else {
    data = await api("/api/create", {
      language: wizard.language,
      category: wizard.category,
      world_description: wizard.worldDescription,
      character_description: wizard.characterDescription,
      gender: wizard.gender,
      age: wizard.age,
    });
  }

  if (data.error) { showWizardError(data); return; }
  gameUi = wizard.uiStrings;
  currentLanguage = wizard.language;
  cameFromActiveGame = false;
  localizeStaticUI();
  roomMode = wizard.multiplayer === "host" || wizard.multiplayer === "join";
  roomId = data.room_id || wizard.roomId || null;

  if (roomMode && !data.started) {
    // Lobby: the shared opening scene waits until the host presses "start"
    // (see renderLobby), so everyone who wants to join in time still can.
    renderLobby(data);
    startRoomPolling();
    return;
  }

  document.getElementById("onboardingView").classList.remove("active");
  document.getElementById("storyView").classList.add("active");
  showTabs(true);
  lastActiveUserId = data.active_user_id;
  await applyState(data);
  if (roomMode) startRoomPolling();
}

initDiceScene();
loadState();
</script>
